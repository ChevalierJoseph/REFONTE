<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refonte</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- Preload only the face that sets the whole interface. It is the one font the
     first paint actually waits on, so it is the one worth a preload; preloading
     more would just contend for bandwidth with the app itself. -->
<link rel="preload" href="/fonts/refonte-ui.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ── The interface face ───────────────────────────────────────────────
   DIN Round A2, subset to what the interface actually sets and rebuilt with
   tabular figures. The rebuild was not cosmetic: this face ships no `tnum`
   and its digits run 823 to 1572 units, so a slider readout counting up
   would have visibly reflowed and shoved its own row around. All ten digits
   are now one width with the ink centred.

   font-display:swap — these labels are chrome, not content. Better to show
   them in a fallback for a moment than to hold the panel empty. */
@font-face{
  font-family:'Refonte UI';
  src:url('/fonts/refonte-ui.woff2') format('woff2');
  font-weight:400;              /* static face: one weight, no synthesis */
  font-style:normal;
  font-display:swap;
}
</style>
<script src="/vendor/opentype.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   REFONTE — instrument shell.
   One ink, one paper, hairlines for everything else. The chrome is
   a control surface: title blocks, labelled cells, a signal chain
   down the inspector, a status rail at the foot. Nothing rounded
   except the two things you grab: switches and slider handles.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --ink-70:rgba(0,0,0,.68);
  --ink-40:rgba(0,0,0,.42);
  --ink-25:rgba(0,0,0,.25);
  --line:rgba(0,0,0,.13);
  --line-2:rgba(0,0,0,.30);
  --hair:1px solid var(--line);
  --hair-2:1px solid var(--line-2);
  /* Every micro-label in the interface rides on --mono. The tail is monospace
     on purpose: if the woff2 ever fails to load, the fallback still holds the
     readouts steady rather than letting them jitter mid-drag. */
  --mono:'Refonte UI',ui-monospace,'SF Mono',Menlo,monospace;
  --sans:'Refonte UI',system-ui,sans-serif;
  --r-lg:12px; --r-md:9px; --r-sm:6px; --r-xs:4px;
  --t:110ms cubic-bezier(.4,0,.2,1);
  --t2:180ms cubic-bezier(.4,0,.2,1);
  /* Easing on its own. --t and --t2 carry a duration AND a curve, which is
     what a transition wants; the animation shorthand reads that duration as a
     DELAY instead, so `animation:x .18s var(--t)` ran as `.18s 110ms …` and,
     with no backwards fill, held the element at its finished state for 110ms
     before snapping back to the start frame. That snap was the flicker. */
  --ease:cubic-bezier(.4,0,.2,1);
  --topH:48px;
}
[data-theme="dark"]{
  --paper:#000000;
  --ink:#ffffff;
  --ink-70:rgba(255,255,255,.7);
  --ink-40:rgba(255,255,255,.45);
  --ink-25:rgba(255,255,255,.28);
  --line:rgba(255,255,255,.17);
  --line-2:rgba(255,255,255,.36);
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:11px;font-weight:400;
  font-variant-ligatures:none;-webkit-font-smoothing:antialiased;
  transition:background var(--t2),color var(--t2);
}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;border-radius:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.grow{flex:1;min-width:0}

/* Native scrollbars are off everywhere: even fully styled, Chromium keeps
   redrawing its own arrows. The bar below is ours — one pill, no chrome,
   fading in only while the panel is in use. */
*{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0;display:none}
.sbar{position:fixed;width:5px;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .22s var(--t)}
.sbar.on{opacity:1;pointer-events:auto}
.sbar-thumb{width:5px;min-height:26px;border-radius:999px;background:var(--ink-25);
  cursor:grab;transition:background var(--t)}
.sbar:hover .sbar-thumb{background:var(--ink-40)}
.sbar-thumb.drag{background:var(--ink);cursor:grabbing}

/* Micro label — the whole interface speaks in these. */
.k,.tab{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);
  white-space:nowrap;font-weight:400}
.tab{color:var(--ink)}

@keyframes riseIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* The wordmark used to ride Archivo's variable width axis, 62 -> 125. It is
   outlines now, so there is no axis to drive; scaleX is the honest analogue —
   the same gesture of the mark opening out, done to the geometry instead. */
@keyframes markIn{from{transform:scaleX(.55);opacity:0}
                  to{transform:scaleX(1);opacity:1}}
@keyframes dropIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ── Top rail ───────────────────────────────── */
.topbar{flex:none;height:var(--topH);display:flex;align-items:center;gap:14px;
  padding:0 16px}
.mark{display:flex;align-items:center;gap:10px;cursor:default;user-select:none}
.mark-name{display:block;line-height:0;
  transform-origin:left center;
  animation:markIn .8s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .45s cubic-bezier(.2,.8,.2,1)}
/* Sized by height; the viewBox carries the 6.8:1 ratio, so width follows. */
.mark-name svg{height:17px;width:auto;display:block;fill:currentColor}
.mark:hover .mark-name{transform:scaleX(.62)}
.mark-sub{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40)}

/* ── Buttons ────────────────────────────────── */
.btn{appearance:none;background:none;border:var(--hair-2);border-radius:var(--r-sm);
  height:28px;padding:0 12px;
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  transition:background var(--t),color var(--t),border-color var(--t)}
.btn .ico{width:9px;height:9px;display:block;flex:none;
  transition:transform var(--t2)}
.btn .ico svg{width:100%;height:100%;display:block;fill:currentColor}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:active:not(:disabled){opacity:.75}
.btn:disabled{color:var(--ink-25);border-color:var(--line);cursor:default}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.on .ico,.btn:hover .ico.plus{transform:rotate(45deg)}
.btn:hover .ico.arrow{transform:translate(2px,-2px)}

/* ── Layout ─────────────────────────────────── */
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 286px}
.main{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px;
  display:flex;flex-direction:column;gap:12px;
  overscroll-behavior:contain}
.main > *{flex:0 0 auto}
.side{min-height:0;display:flex;padding:14px 14px 14px 0}
.sidepanel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* Only the effect list scrolls — sources stay at the head, exports at the
   foot, both inside the same rounded block. */
.fxscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}


/* Every framed block wears a title block on its top rule. */
.panel{border:var(--hair-2);border-radius:var(--r-lg);overflow:hidden;animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both}
.panel:nth-of-type(2){animation-delay:.06s}
.panel-bar{height:26px;display:flex;align-items:center;gap:12px;padding:0 11px;
  border-bottom:var(--hair)}
.panel-bar .k{color:var(--ink-40)}

/* ── Stage ──────────────────────────────────── */
.stage{position:relative}
.canvasbox{height:440px;min-height:240px;position:relative;cursor:text;overflow:hidden}
.canvasbox svg.preview-svg{position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;display:block}
.canvasbox .editor{position:absolute;inset:0;width:100%;height:100%;
  background:transparent;color:transparent;caret-color:var(--ink);
  border:none;outline:none;resize:none;
  font-family:'glyphlab-font',system-ui,sans-serif;font-weight:400;
  overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
  white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;
  font-kerning:none;font-variant-ligatures:none;font-feature-settings:normal}
.canvasbox .editor::-webkit-scrollbar{width:0;height:0}
.canvasbox .editor::selection{background:var(--ink-25)}
.canvasbox .clear-btn{position:absolute;top:10px;right:10px;width:24px;height:24px;
  border:var(--hair-2);border-radius:var(--r-sm);background:var(--paper);color:var(--ink-40);cursor:pointer;
  font-size:13px;line-height:1;padding:0;display:none;
  align-items:center;justify-content:center;opacity:0;
  transition:opacity var(--t),background var(--t),color var(--t),border-color var(--t)}
.canvasbox .clear-btn.on{display:flex;opacity:1}
.canvasbox .clear-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ── Control strip ──────────────────────────── */
.ctrl{position:relative;flex:none;display:flex;align-items:stretch;flex-wrap:wrap;
  border:var(--hair-2);border-radius:var(--r-lg);min-height:44px;
  animation:riseIn .5s cubic-bezier(.2,.8,.2,1) .03s both}
.ctrl-item{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:42px;
  border-right:var(--hair);white-space:nowrap}
.ctrl-item label{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40)}
.ctrl .spacer{flex:1;min-width:0;border-right:none}
.ctrl .ctrl-btn{margin:0;border:none;border-left:var(--hair);height:auto;align-self:stretch;
  padding:0 16px;border-radius:0 calc(var(--r-lg) - 1px) calc(var(--r-lg) - 1px) 0}
.ctrl .ctrl-btn.open{background:var(--ink);color:var(--paper)}
.ctrl .ctrl-btn.open .ico{transform:rotate(45deg)}

/* Numeric field */
.numspin{display:inline-flex;align-items:center;height:24px;border:var(--hair-2);
  border-radius:var(--r-sm);overflow:hidden;padding-left:7px;transition:border-color var(--t)}
.numspin:focus-within{border-color:var(--ink)}
.numspin input{width:38px;border:none;background:none;padding:0;outline:none;
  font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.02em;
  -moz-appearance:textfield}
.numspin input::-webkit-outer-spin-button,.numspin input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.numspin .unit{font-size:8.5px;color:var(--ink-40);padding:0 5px 0 1px;letter-spacing:.1em}
.numspin .spin{display:flex;flex-direction:column;align-self:stretch;border-left:var(--hair)}
.numspin .spin button{width:15px;flex:1;border:none;background:none;padding:0;cursor:pointer;
  color:var(--ink-40);font-size:5px;line-height:1;display:flex;align-items:center;
  justify-content:center;transition:background var(--t),color var(--t)}
.numspin .spin button:first-child{border-bottom:var(--hair)}
.numspin .spin button:hover{background:var(--ink);color:var(--paper)}

/* Colour chips */
.swatch{width:20px;height:20px;border:1px solid var(--ink);border-radius:var(--r-xs);
  cursor:pointer;display:block;
  transition:box-shadow var(--t)}
.swatch:hover{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.swatch.checker{background:conic-gradient(var(--line-2) 25%,var(--paper) 0 50%,
  var(--line-2) 0 75%,var(--paper) 0) 0 0/8px 8px}

/* Segmented sets — shape sets, alignment, colour mode */
.seg,.align-group{display:flex;border:var(--hair-2);border-radius:var(--r-sm);overflow:hidden}
.seg{flex-wrap:wrap}
.seg button,.align-group button{flex:1;min-width:0;border:none;border-left:var(--hair);
  background:none;color:var(--ink-40);height:24px;padding:0 9px;cursor:pointer;
  font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--t),color var(--t)}
.seg button:first-child,.align-group button:first-child{border-left:none}
.seg button:hover,.align-group button:hover{color:var(--ink)}
.seg button.on,.align-group button.on{background:var(--ink);color:var(--paper)}
.align-group button{width:28px;flex:none;padding:0}
.align-group button svg{width:12px;height:12px;display:block;fill:currentColor}

/* Colour picker popover — fixed so it escapes every stacking context */
.cpick{position:fixed;z-index:200;width:218px;display:none;
  background:var(--paper);border:1px solid var(--ink);border-radius:var(--r-lg);padding:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.18)}
.cpick.open{display:block;animation:dropIn .16s var(--ease)}
.cpick .cp-top{display:flex;align-items:center;margin-bottom:11px}
.cpick .cp-name{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40)}
.cpick .cp-preview{width:18px;height:18px;border:1px solid var(--ink);
  border-radius:var(--r-xs);margin-left:auto}
.cpick .seg{margin-bottom:12px}
.cpick .cp-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cpick .cp-row .k{width:11px;flex:none;color:var(--ink)}
.cpick .cp-row input[type=range]{flex:1}
.cpick .cp-row .v{width:28px;text-align:right;font-size:10px;flex:none;
  font-variant-numeric:tabular-nums}
.cpick .cp-hex{display:flex;align-items:center;height:26px;margin-top:10px;padding:0 8px;
  border:var(--hair-2);border-radius:var(--r-sm);transition:border-color var(--t)}
.cpick .cp-hex:focus-within{border-color:var(--ink)}
.cpick .cp-hex span{color:var(--ink-40)}
.cpick .cp-hex input{flex:1;min-width:0;border:none;background:none;outline:none;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-left:4px}
.cpick .cp-alpha{margin-top:10px;margin-bottom:0}
.cpick .cp-preview.checker{background:conic-gradient(var(--line-2) 25%,var(--paper) 0 50%,
  var(--line-2) 0 75%,var(--paper) 0) 0 0/6px 6px}

/* ── Specimen grid ──────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));
  border-left:var(--hair);border-top:var(--hair)}
.cell{aspect-ratio:1;border-right:var(--hair);border-bottom:var(--hair);position:relative}
.cell svg{position:absolute;inset:0;width:100%;height:100%}
/* The character each cell is proofing — on tap of the mouse only, so the
   sheet stays a specimen rather than a table. */
.cell::after{content:attr(data-ch);position:absolute;left:5px;bottom:3px;font-size:7.5px;
  color:var(--ink-40);opacity:0;transition:opacity var(--t);pointer-events:none}
.cell:hover::after{opacity:1}

/* ── Inspector ──────────────────────────────── */
.load-row{flex:none;display:flex;gap:8px;padding:10px;border-bottom:var(--hair-2)}
.load-row .btn{flex:1;min-width:0;height:32px;justify-content:center;padding:0 8px}
.svg-chip{display:none;align-items:center;gap:8px;height:20px;padding:0 8px;cursor:pointer;
  border:var(--hair-2);border-radius:var(--r-xs);background:none;color:var(--ink);
  font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;max-width:60%;
  transition:background var(--t),color var(--t),border-color var(--t)}
.svg-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svg-chip:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
body.artwork .svg-chip{display:inline-flex}
body.artwork .stage .panel-bar .k{display:none}
body.artwork .canvasbox .editor,body.artwork .canvasbox .clear-btn{display:none}
body.artwork #specimen{display:none}
.effects-btn{position:relative;flex:none;width:100%;height:34px;
  border:none;border-bottom:var(--hair-2);background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer;
  font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  transition:background var(--t),color var(--t)}
.effects-btn .ico{width:9px;height:9px;display:block;transition:transform var(--t2)}
.effects-btn .ico svg{width:100%;height:100%;display:block;fill:currentColor}
.effects-btn:hover{background:var(--ink);color:var(--paper)}
.effects-btn:hover .ico,.effects-btn.open .ico{transform:rotate(45deg)}
.effects-btn.open{background:var(--ink);color:var(--paper)}

/* The effects list hangs off the button and floats OVER the chain below it,
   rather than sitting in the flow and shoving every card down the panel.
   .fxhead is the anchor and carries the z-index: the cards are position:
   relative, so they are positioned descendants too and would otherwise paint
   over a picker that merely came earlier in the document. */
.fxhead{position:relative;flex:none;z-index:30}
.picker{position:absolute;top:100%;left:0;right:0;display:none;
  background:var(--paper);border-bottom:var(--hair-2);
  max-height:min(58vh,340px);overflow-y:auto;
  box-shadow:0 12px 22px rgba(0,0,0,.13)}
.picker.open{display:block;animation:dropIn .18s var(--ease)}
.picker-item{position:relative;display:flex;align-items:center;width:100%;height:30px;
  padding:0 10px;border:none;border-bottom:var(--hair);background:none;color:inherit;
  text-align:left;font-size:9px;letter-spacing:.2em;cursor:pointer;
  transition:background var(--t),color var(--t),padding-left var(--t2)}
.picker-item:last-child{border-bottom:none}
.picker-item::after{content:"+";position:absolute;right:12px;opacity:0;
  transition:opacity var(--t)}
.picker-item:hover{background:var(--ink);color:var(--paper);padding-left:18px}
.picker-item:hover::after{opacity:1}
.picker-item.added{color:var(--ink-25);pointer-events:none}

/* Signal chain: outlines in at the top, result out at the foot, every
   active effect a numbered node on the line between them. The order is
   the order they are applied — the line is the pipeline. */
.fx{counter-reset:fx;padding:10px}
.fx-empty{padding:14px 12px;border:1px dashed var(--line-2);border-radius:var(--r-md);
  font-size:9.5px;line-height:1.6;color:var(--ink-40)}
.fx:has(.card) .fx-empty{display:none}

.stack{display:flex;flex-direction:column;gap:8px}
.stack:empty{display:none}
.stack:not(:empty){margin-bottom:8px}
.card{position:relative;background:var(--paper);counter-increment:fx;
  border:var(--hair-2);border-radius:var(--r-md);overflow:hidden}
.card-head{display:flex;align-items:center;gap:9px;padding:8px 10px;user-select:none}
.card-head::before{content:counter(fx,decimal-leading-zero);flex:none;font-size:8.5px;
  letter-spacing:.06em;color:var(--ink-40);transition:color var(--t)}
.card-head .title{flex:1;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  transition:color var(--t)}
.card-head.off::before,.card-head.off .title{color:var(--ink-25)}

/* Switch and slider handles are the only round things here — they are the
   only two you physically grab. */
.sw{width:30px;height:16px;border-radius:999px;position:relative;flex:none;cursor:pointer;
  border:1px solid var(--ink);background:none;transition:background var(--t)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;
  border-radius:50%;background:var(--ink);
  transition:left var(--t2),background var(--t)}
.sw.on{background:var(--ink)}
.sw.on::after{left:16px;background:var(--paper)}

.icobtn{width:22px;height:22px;border:none;border-radius:var(--r-xs);background:none;
  color:var(--ink-40);cursor:pointer;
  padding:0;display:flex;align-items:center;justify-content:center;flex:none;
  transition:color var(--t),background var(--t)}
.icobtn:hover{color:var(--paper);background:var(--ink)}
.icobtn svg{width:11px;height:11px;display:block}

.card-body{display:none;border-top:var(--hair);padding:11px 10px 12px}
.card.open .card-body{display:block;animation:dropIn .18s var(--ease)}

/* Baked — the recipe stays readable, nothing in it answers. */
.card.baked{border-style:dashed}
.card.baked .card-head::before{color:var(--ink-40)}
.card.baked .card-head .title{color:var(--ink-40)}
.card.baked .lockmark{width:22px;height:22px;display:flex;align-items:center;
  justify-content:center;color:var(--ink-40);flex:none}
.card.baked .lockmark svg{width:12px;height:12px}
.baked-note{font-size:9.5px;line-height:1.6;color:var(--ink-40);margin:0 0 10px}
.baked-note.dim{margin-bottom:0}
.undo-btn{width:100%;height:28px;border:var(--hair-2);border-radius:var(--r-sm);
  background:none;color:inherit;
  cursor:pointer;margin-bottom:12px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  transition:background var(--t),color var(--t),border-color var(--t)}
.undo-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.frozen{opacity:.4;pointer-events:none}

/* ── Controls inside a card ─────────────────── */
.opt{margin-bottom:11px}
.opt:last-child{margin-bottom:0}
.opt label,.opt-label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-40);
  margin-bottom:4px}
.opt label span{color:var(--ink);font-variant-numeric:tabular-nums;font-size:10px;
  letter-spacing:.02em;text-transform:none}
.opt input[type=range]{width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;height:14px;
  width:100%;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
  border-radius:50%;background:var(--paper);border:1px solid var(--ink);margin-top:-5px;
  transition:background var(--t)}
input[type=range]:hover::-webkit-slider-thumb,
input[type=range]:active::-webkit-slider-thumb{background:var(--ink)}
input[type=range]::-moz-range-track{height:1px;background:var(--line-2)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
  background:var(--paper);border:1px solid var(--ink)}

.filebtn{display:block;height:28px;line-height:26px;text-align:center;cursor:pointer;
  border:1px dashed var(--line-2);border-radius:var(--r-sm);margin:0 0 11px;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-40);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;padding:0 8px;
  transition:background var(--t),color var(--t),border-color var(--t)}
.filebtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);
  border-style:solid}
.hint{font-size:9.5px;color:var(--ink-40);line-height:1.6;margin:4px 0 0}
.muted{opacity:.4}
.numinput-row{display:flex;justify-content:space-between;align-items:center}
.numinput-row .lbl{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-40)}
.numinput-row .numspin input{width:40px}

/* ── Distort widget ─────────────────────────── */
.warp{margin:0 0 11px}
.warp-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.warp-head .warp-title{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-40)}
.warp-head .warp-readout{font-size:9px;color:var(--ink);font-variant-numeric:tabular-nums;
  margin-left:auto;white-space:nowrap}
.warp-head .warp-reset{width:20px;height:20px;border:none;border-radius:var(--r-xs);
  background:none;color:var(--ink-40);
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  transition:color var(--t),background var(--t)}
.warp-head .warp-reset:hover{color:var(--paper);background:var(--ink)}
.warp-head .warp-reset svg{width:12px;height:12px;display:block}
.warp-svg{width:100%;aspect-ratio:1;border:var(--hair-2);border-radius:var(--r-md);
  background:none;display:block;
  touch-action:none}
.warp-svg .grid-dot{fill:var(--ink);opacity:.16}
.warp-svg .warp-shape{fill:var(--ink);pointer-events:none}
.warp-svg .warp-edge{fill:none;stroke:var(--ink);stroke-width:.7;stroke-dasharray:2.5 2.5;
  opacity:.45;pointer-events:none}
.warp-svg .warp-handle{fill:var(--paper);stroke:var(--ink);stroke-width:1.2;cursor:grab}
.warp-svg .warp-handle.rot{fill:var(--paper);stroke:var(--ink);stroke-width:1.2;cursor:grab}
.warp-svg .warp-handle:hover,.warp-svg .warp-handle.dragging,
.warp-svg .warp-handle.rot:hover,.warp-svg .warp-handle.rot.dragging{
  fill:var(--ink);cursor:grabbing}
.warp-svg .warp-rot-stem{stroke:var(--ink);stroke-width:.7;opacity:.35}
.warp-hint{font-size:8.5px;color:var(--ink-40);line-height:1.5;margin:6px 0 0;
  text-align:center;letter-spacing:.06em}

/* ── Export ─────────────────────────────────── */
.export-row{flex:none;display:flex;gap:8px;padding:10px;border-top:var(--hair-2)}
.export-row .btn{flex:1;height:34px;justify-content:space-between;padding:0 10px}

/* ── Montage timeline ───────────────────────── */
.tl{display:none;border:var(--hair-2);border-radius:var(--r-lg);overflow:hidden;flex:none}
.tl.open{display:block;animation:dropIn .2s var(--ease)}
.tl-top{display:flex;align-items:center;gap:12px;height:28px;padding:0 12px;
  border-bottom:var(--hair)}
.tl-title{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase}
.tl-time{font-size:10px;color:var(--ink-40);font-variant-numeric:tabular-nums}
.tl-spacer{flex:1;min-width:6px}
.tl-x{width:22px;height:22px;border:none;border-radius:var(--r-xs);background:none;
  color:var(--ink-40);cursor:pointer;
  font-size:11px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;
  transition:color var(--t),background var(--t)}
.tl-x:hover{color:var(--paper);background:var(--ink)}
.tl-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;row-gap:9px;padding:10px 12px}
.tl-transport{display:flex}
.tl-btn{border:var(--hair-2);border-radius:var(--r-sm);background:none;color:inherit;
  height:26px;min-width:26px;
  padding:0 11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  transition:background var(--t),color var(--t),border-color var(--t)}
.tl-transport{gap:5px}
.tl-btn:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl-btn:disabled{color:var(--ink-25);border-color:var(--line);cursor:default}
.tl-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl-btn.primary:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.tl-btn.primary:disabled{background:none;color:var(--ink-25);border-color:var(--line)}
.tl-fields{display:flex;align-items:center;gap:16px;flex-wrap:wrap;row-gap:9px}
.tl-field{display:flex;align-items:center;gap:8px}
.tl-field > .k{color:var(--ink-40)}
.tl-field select{background:none;color:inherit;height:24px;padding:0 22px 0 8px;
  font-size:10px;outline:none;cursor:pointer;border:var(--hair-2);border-radius:var(--r-sm);
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  transition:border-color var(--t)}
.tl-field select:hover{border-color:var(--ink)}
.tl-field .numspin input{width:38px}
.tl-track{position:relative;padding:0 14px;cursor:col-resize;touch-action:none;
  border-top:var(--hair);border-bottom:var(--hair)}
.tl-inner{position:relative;height:72px}
.tl-ruler{position:relative;height:20px;border-bottom:var(--hair)}
.tl-tick{position:absolute;top:11px;bottom:0;width:0;border-left:1px solid var(--line-2)}
.tl-tick span{position:absolute;left:5px;top:-11px;font-size:8px;color:var(--ink-40);
  white-space:nowrap;letter-spacing:.08em}
.tl-tick.last span{left:auto;right:3px}
.tl-lane{position:relative;height:52px}
.tl-guide{position:absolute;left:0;right:0;top:25px;height:1px;background:var(--line)}
.tl-span{position:absolute;top:25px;height:1px;background:var(--ink)}
.tl-key{position:absolute;top:19px;width:12px;height:12px;margin-left:-6px;
  background:var(--paper);border:1px solid var(--ink);transform:rotate(45deg);cursor:grab;
  transition:background var(--t)}
.tl-key:hover{background:var(--ink)}
.tl-key.sel{background:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.tl-key:active{cursor:grabbing}
.tl-head{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--ink);
  pointer-events:none}
.tl-head::before{content:"";position:absolute;top:0;left:-4px;width:8px;height:8px;
  background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
.tl-foot{display:flex;align-items:center;gap:10px;padding:10px 12px}
.tl-prog{font-size:9.5px;color:var(--ink-40);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0}
.tl-hint{font-size:9.5px;color:var(--ink-40);margin:0;padding:0 12px 12px;line-height:1.6}

/* ── Status rail ────────────────────────────── */
.status{flex:none;height:26px;display:flex;align-items:stretch;border-top:var(--hair-2);
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-40)}
.status .st{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:var(--hair);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.status .st:last-child{border-right:none;border-left:var(--hair);margin-left:auto}
.status .st b{font-weight:400;color:var(--ink-25)}
.status .st > span{color:var(--ink);letter-spacing:.1em}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
@media(max-height:760px){
  .canvasbox{height:320px}
}
@media(max-width:1200px){
  .app{grid-template-columns:minmax(0,1fr) 268px}
}
@media(max-width:1020px){
  html,body{height:auto;overflow:visible}
  body{min-height:100dvh}
  .app{grid-template-columns:1fr}
  .main{overflow:visible}
  .side{padding:0 14px 14px}
  .sidepanel{height:auto}
  .fxscroll{overflow:visible}
  /* Here the panel is only as tall as its content, so an overlaid picker would
     be cut off by .sidepanel's overflow:hidden — with an empty chain the panel
     is barely 200px and the list is taller than that. The page scrolls as one
     on this breakpoint, so putting the list back in the flow costs nothing and
     keeps every entry reachable. */
  .picker{position:static;max-height:none;box-shadow:none}
  .status{position:sticky;bottom:0;background:var(--paper);z-index:20}
  .status .st{max-width:none}
}
@media(max-width:560px){
  .mark-sub{display:none}
  .ctrl .ctrl-btn{width:100%;border-left:none;border-top:var(--hair);
    justify-content:space-between;min-height:42px}
  .ctrl .spacer{display:none}
  .status .st:nth-child(2){display:none}
}
</style>

<!-- The colour popover lives at body level on purpose.

     Inside the control strip it was unusable: .ctrl carries
     `animation:riseIn … both`, and an animation on transform/opacity makes an
     element a stacking context for as long as it runs OR fills — which, with
     fill-mode `both`, is forever. So .ctrl was a permanent stacking context and
     the popover's z-index could only ever compete with .ctrl's own children.
     The specimen panel sits later in the document and is a stacking context
     too, so it painted straight over the popover: you could see the glyphs
     through it, and every click meant for a slider landed on the grid instead.

     As a child of <body> the popover is in the root stacking context, so
     z-index actually means something and it takes its own pointer events.
     It is position:fixed and placed from viewport coordinates by openCpick(). -->
<div class="cpick" id="cpick"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   0. STATE
   ══════════════════════════════════════════════════════════════ */

let font=null, upm=1000, ready=false;
/* An imported .svg becomes the source instead of the typed text: same
   effect stack, same exports, just one drawing rather than a charset. */
let artwork=null;   // {contours, width, name}
let baseOverride=null;
const CHARSET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,;:!?&()-–'\"@#/*+=%".split('');

const REGISTRY = {}; const EFFECTS_ORDER = [];
function defEffect(def){
  REGISTRY[def.type]=def;
  EFFECTS_ORDER.push(def.type);
}
function defaults(type){
  const o={}; for(const c of REGISTRY[type].controls) if(c.key) o[c.key]=c.def;
  if(REGISTRY[type].warp){
    for(const k of ['TL','TR','BR','BL']){ o['warp'+k+'x']=0; o['warp'+k+'y']=0; }
    o.warpSX=1; o.warpSY=1; o.warpTX=0; o.warpTY=0; o.warpROT=0;
  }
  return o;
}

const stack = [];        // [{type, on:bool, open:bool, p:{...}}, ...]
let pickerOpen = false;
/* Set by addEffect, consumed by the next renderStack: the id of the card that
   should mark itself and scroll into view. Held here rather than on the effect
   because it is a one-shot piece of presentation, not part of the recipe. */
let freshId = null;

/* The ink colour when none has been picked: whatever the theme is using. */
const themeInk = () =>
  document.documentElement.dataset.theme==='dark' ? '#ffffff' : '#000000';

const cfg = {
  colorInk: null,      // null → follow the theme
  colorBg:  null,
  align: 'left',
  tracking: 0,
};

/* Each entry gets its own id, so the same effect can appear twice in the
   stack and its card still has a unique handle. */
let nextEffectId = 1;
const byId = id => stack.find(e=>e.id===id);

/* Baking freezes the current result into the base outlines. The only thing
   it actually unlocks is re-using an effect that is already in the stack —
   applying it twice needs the first pass turned into geometry first. It now
   happens on its own, and every bake is reversible. */
let bakeVersion = 0;
const bakes = [];          // [{base, ids:[…], reason}] — newest last

function bakeNow(reason){
  if(!ready) return false;
  const live = stack.filter(e=>!e.baked);
  if(!live.length) return false;
  const m=new Map();
  for(const ch of CHARSET){
    const g=font.charToGlyph(ch);
    m.set(g.index, processGlyph(g).map(c=>c.slice()));
  }
  const sp=font.charToGlyph(' '); if(sp) m.set(sp.index, []);
  bakes.push({base:baseOverride, ids:live.map(e=>e.id), reason});
  baseOverride=m;
  for(const e of live){ e.baked=true; e.open=false; e.bakeIndex=bakes.length; }
  bakeVersion++;
  cache.clear();
  return true;
}

/* Undo the most recent bake: the outlines go back to what they were and the
   frozen effects become live again, parameters and all. Anything added since
   simply keeps applying on top, so nothing is lost either way. */
function unbake(){
  const b=bakes.pop();
  if(!b) return;
  baseOverride=b.base;
  for(const id of b.ids){
    const e=byId(id);
    if(e){ e.baked=false; e.bakeIndex=null; e.bakeReason=null; }
  }
  bakeVersion++;
  cache.clear();
  invalidate(); renderSidebar();
}

function addEffect(type){
  /* Adding an effect that is already in the stack: bake what is there so the
     first pass becomes geometry, then start a fresh instance on top. */
  const dup = stack.find(e=>e.type===type && !e.baked);
  if(dup){
    const label=REGISTRY[type].label;
    if(bakeNow(label))
      for(const e of stack) if(e.baked && e.bakeIndex===bakes.length && !e.bakeReason)
        e.bakeReason=label;
  }
  const inst = {id:nextEffectId++, type, on:true, open:true, baked:false, p:defaults(type)};
  stack.push(inst);
  freshId = inst.id;
  pickerOpen = false;
  invalidate(); renderSidebar();
}
function removeEffect(id){
  const i = stack.findIndex(e=>e.id===id);
  if(i>=0) stack.splice(i,1);
  invalidate(); renderSidebar();
}
function toggleEffect(id){
  const e = byId(id); if(!e || e.baked) return;
  e.on = !e.on;
  invalidate(); renderSidebar();
}
function toggleEffectOpen(id){
  const e = byId(id); if(!e) return;
  e.open = !e.open; renderSidebar();
}
function anyEffectOn(){ return stack.some(e=>e.on); }

/* ══════════════════════════════════════════════════════════════
   1. EFFECT DEFINITIONS
   Order in the picker: SLICE · PIXEL · HALFTONE · SCREEN
                        BASIC · BLUR · STIPPLE · EXTRUDE · ECHOE
   ══════════════════════════════════════════════════════════════ */

/* ─── SLICE ───
   Cuts the glyph into N slices along a rotated axis, then shifts each
   slice perpendicularly. STAGGER walks the offset one way, slice after
   slice, into a staircase; WAVE sends it through a full sine so the
   letter leans out and comes back. */
defEffect({ type:'slice', label:'SLICE',
  controls:[
    {key:'pattern',type:'seg',label:'shift pattern',def:'stagger',
      opts:[['stagger','stagger'],['wave','wave']]},
    {key:'cuts',label:'cuts',min:1,max:40,step:1,def:10},
    {key:'angle',label:'cut angle',min:0,max:180,step:1,def:90,unit:'°'},
    {key:'shift',label:'shift',min:-200,max:200,step:1,def:28},
  ],
  apply(cs,p){ return sliceGlyph(cs,p); } });

/* ─── PIXEL ─── */
defEffect({ type:'pixel', label:'PIXEL', warp:true,
  controls:[
    {key:'precision',label:'precision',min:4,max:80,step:1,def:22},
    {key:'dotSize',label:'dot size',min:0.2,max:10,step:0.05,def:0.9},
    {key:'shape',type:'seg',label:'shape',def:'square',
      opts:[['square','square'],['circle','circle'],['triangle','triangle']]},
    {type:'file',label:'load any shape (image/svg)'},
    {type:'warp'},
    {key:'threshold',label:'threshold',min:0.05,max:0.95,step:0.05,def:0.5},
    {key:'scatter',label:'scatter',min:0,max:2,step:0.05,def:0},
  ],
  apply(cs,p){
    const spacing=upm/p.precision, cell=Math.max(upm/300, spacing/3);
    const F=buildField(cs, cell, cell*3, 2); if(!F) return cs;
    const warp = warpOf(p);
    return dotScreen(F,{mode:'dots', shape:p.shape, gap:p.dotSize, threshold:p.threshold,
      scatter:p.scatter, modulate:true, custom:p.custom, spacing, warp});
  } });

/* ─── HALFTONE ───
   Amplitude-modulated screen: one dot per cell of a rotated lattice, its
   area following the local coverage. Softness blurs the source first —
   without it a solid letter has nothing to modulate and the screen closes
   into a blob, which is exactly how a real halftone behaves. */
defEffect({ type:'halftone', label:'HALFTONE',
  controls:[
    {key:'freq',label:'frequency',min:4,max:60,step:1,def:18},
    {key:'angle',label:'screen angle',min:0,max:90,step:1,def:45,unit:'°'},
    {key:'shape',type:'seg',label:'dot',def:'circle',
      opts:[['circle','round'],['square','square'],['diamond','diamond']]},
    {key:'soft',label:'softness',min:0,max:200,step:2,def:60},
    {key:'dot',label:'dot size',min:0.4,max:1.7,step:0.05,def:1.1},
    {key:'contrast',label:'contrast',min:-100,max:100,step:2,def:0},
    {key:'ramp',label:'gradient',min:0,max:100,step:1,def:0},
    {key:'rampAngle',label:'gradient angle',min:0,max:360,step:15,def:90,unit:'°'},
  ],
  apply(cs,p){ return halftoneScreen(cs,p); } });

/* ─── SCREEN ───
   Print rulings. Each line is a ribbon whose half-width is sampled along
   its length, so 'tonal' gives the swelling line of an engraving while
   'flat' gives a plain mechanical rule. */
defEffect({ type:'screen', label:'SCREEN',
  controls:[
    {key:'tone',type:'seg',label:'line weight',def:'flat',
      opts:[['flat','flat'],['tonal','tonal']]},
    {key:'freq',label:'frequency',min:3,max:60,step:1,def:14},
    {key:'angle',label:'angle',min:0,max:180,step:1,def:45,unit:'°'},
    {key:'weight',label:'thickness',min:0.05,max:1,step:0.05,def:0.5},
    {key:'soft',label:'softness',min:0,max:200,step:2,def:0},
    {key:'contrast',label:'contrast',min:-100,max:100,step:2,def:0},
  ],
  apply(cs,p){ return lineScreen(cs, {...p, pattern:'lines'}); } });

/* ─── BASIC ─── */
defEffect({ type:'basic', label:'BASIC',
  controls:[
    {key:'weight',label:'weight',min:-40,max:90,step:1,def:0},
    {key:'slant',label:'slant/antislant',min:-30,max:30,step:1,def:0,unit:'°'},
    {key:'round',label:'corner radius',min:0,max:160,step:2,def:0},
    {key:'contour',type:'numinput',label:'contour',min:0,max:60,step:1,def:0,unit:' pt'},
  ],
  apply(cs,p){
    let out = cs;
    if(p.weight)  out = emboldenMorpho(out, p.weight*upm/1000);
    if(p.slant)   out = out.map(c=>shear(c, Math.tan(p.slant*Math.PI/180)));
    if(p.round)   out = out.map(c=>roundCorners(c, p.round*upm/1000));
    if(p.contour>0){
      const t = p.contour*upm/1000;
      const strokes=[];
      for(const c of out){
        const s=Math.sign(area(c))||1;
        const outer=offsetContour(c, t*0.5, s);
        const inner=offsetContour(c, -t*0.5, s).reverse();
        if(outer.length>2 && inner.length>2) strokes.push(outer, inner);
      }
      out = strokes;
    }
    return out;
  } });

/* ─── BLUR ─── */
defEffect({ type:'blur', label:'BLUR',
  controls:[
    {key:'blur',label:'blur amount',min:0,max:180,step:2,def:0},
    {key:'darkness',label:'darkness',min:-100,max:100,step:2,def:0},
    {key:'levels',label:'levels',min:0,max:10,step:1,def:0},
    {key:'rings',label:'isolines',min:0,max:14,step:1,def:0},
    {key:'thickness',label:'isoline thickness',min:3,max:40,step:1,def:8},
  ],
  apply(cs,p){
    if(!p.blur && !p.rings && !p.levels) return cs;
    const cell=upm/200, blurPx=(p.blur*upm/1000)/cell;
    const pad=Math.max(cell*2, blurPx*cell*2.2);
    const F=buildField(cs, cell, pad, 1); if(!F) return cs;
    boxBlur(F, blurPx);
    /* Darkness simply decides how much room the black takes: push it up and
       the ink spreads into the halo, pull it down and it retreats to the core. */
    applyDarkness(F, p.darkness);
    if(p.levels>0) return levelBands(F, p.levels, cell);
    return isolines(F, {rings:p.rings, thickness:p.thickness}, cell);
  } });

/* ─── STIPPLE ─── */
defEffect({ type:'stipple', label:'STIPPLE',
  controls:[
    {key:'density',label:'density',min:0.2,max:8,step:0.1,def:2},
    {key:'dotSize',label:'dot size',min:2,max:30,step:0.5,def:8},
    {key:'blur',label:'blur amount',min:0,max:180,step:2,def:0},
    {key:'sizeMax',label:'max dot size',min:2,max:30,step:0.5,def:10},
    {key:'sizeMin',label:'min dot size',min:0.5,max:10,step:0.5,def:2},
  ],
  apply(cs,p){
    if(p.blur > 0){
      const cell=upm/200, blurPx=(p.blur*upm/1000)/cell;
      const pad=Math.max(cell*2, blurPx*cell*2.2);
      const F=buildField(cs, cell, pad, 1); if(!F) return cs;
      boxBlur(F, blurPx);
      return blurStipple(F,{density:p.density, sizeMax:p.sizeMax, sizeMin:p.sizeMin});
    }
    const F=buildField(cs, upm/240, upm/60, 1); if(!F) return cs;
    return stipple(F,{density:p.density, size:p.dotSize});
  } });

/* ─── EXTRUDE ─── */
defEffect({ type:'extrude', label:'EXTRUDE',
  controls:[
    {key:'depth',label:'depth',min:0,max:200,step:2,def:0},
    {key:'direction',label:'direction',min:0,max:360,step:5,def:315,unit:'°'},
  ],
  apply(cs,p){
    if(!p.depth) return cs;
    return extrudeSolid(cs, p.depth*upm/1000, p.direction, 400);
  } });

/* ─── ECHOE ─── */
defEffect({ type:'echoe', label:'ECHOE',
  controls:[
    {key:'count',label:'ring count',min:1,max:12,step:1,def:4},
    {key:'spacing',label:'spacing',min:0,max:80,step:2,def:0},
    {key:'thickness',label:'line thickness',min:1,max:20,step:1,def:4},
  ],
  apply(cs,p){ return p.spacing ? contourEchoes(cs,{count:p.count, gap:p.spacing*upm/1000,
    thickness:p.thickness*upm/1000, includeCore:true}) : cs; } });

/* ══════════════════════════════════════════════════════════════
   2. GEOMETRY UTILITIES
   ══════════════════════════════════════════════════════════════ */
function flatten(cmds, tol){
  const out=[]; let cur=null, px=0, py=0, sx=0, sy=0;
  const push=(x,y)=>{ const l=cur[cur.length-1]; if(!l||Math.hypot(l.x-x,l.y-y)>1e-6) cur.push({x,y}); };
  const steps=(len)=> Math.max(4, Math.min(48, Math.ceil(len/tol)));
  for(const c of cmds){
    if(c.type==='M'){ if(cur&&cur.length>2) out.push(cur); cur=[{x:c.x,y:c.y}]; px=sx=c.x; py=sy=c.y; }
    else if(c.type==='L'){ push(c.x,c.y); px=c.x; py=c.y; }
    else if(c.type==='Q'){
      const n=steps(Math.hypot(c.x1-px,c.y1-py)+Math.hypot(c.x-c.x1,c.y-c.y1));
      for(let i=1;i<=n;i++){ const t=i/n,u=1-t;
        push(u*u*px+2*u*t*c.x1+t*t*c.x, u*u*py+2*u*t*c.y1+t*t*c.y); }
      px=c.x; py=c.y;
    }
    else if(c.type==='C'){
      const n=steps(Math.hypot(c.x1-px,c.y1-py)+Math.hypot(c.x2-c.x1,c.y2-c.y1)+Math.hypot(c.x-c.x2,c.y-c.y2));
      for(let i=1;i<=n;i++){ const t=i/n,u=1-t;
        push(u*u*u*px+3*u*u*t*c.x1+3*u*t*t*c.x2+t*t*t*c.x,
             u*u*u*py+3*u*u*t*c.y1+3*u*t*t*c.y2+t*t*t*c.y); }
      px=c.x; py=c.y;
    }
    else if(c.type==='Z'){ if(cur&&cur.length>2) out.push(cur); cur=null; px=sx; py=sy; }
  }
  if(cur&&cur.length>2) out.push(cur);
  return out;
}
const area = c => { let a=0; for(let i=0,n=c.length;i<n;i++){ const p=c[i],q=c[(i+1)%n]; a+=p.x*q.y-q.x*p.y; } return a/2; };
const bboxOf = cs => { let b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  for(const c of cs) for(const p of c){ b.x0=Math.min(b.x0,p.x); b.y0=Math.min(b.y0,p.y); b.x1=Math.max(b.x1,p.x); b.y1=Math.max(b.y1,p.y);} return b; };

/* Offset a closed contour by distance d (s = winding sign).
   Sharp convex corners are joined with an arc rather than a miter: a miter
   shoots a long spike out of the corner, which is very visible once the
   offset gets big (concentric rings, thick outlines). */
function offsetContour(c,d,s){
  const n=c.length, out=[];
  const MITER=1.35;                 // beyond this, switch to a round join
  const ad=Math.abs(d);
  for(let i=0;i<n;i++){
    const p=c[i], a=c[(i-1+n)%n], b=c[(i+1)%n];
    const e1={x:p.x-a.x,y:p.y-a.y}, e2={x:b.x-p.x,y:b.y-p.y};
    const l1=Math.hypot(e1.x,e1.y)||1, l2=Math.hypot(e2.x,e2.y)||1;
    const n1x=s*e1.y/l1, n1y=-s*e1.x/l1, n2x=s*e2.y/l2, n2y=-s*e2.x/l2;
    const dot=Math.max(-1,Math.min(1,n1x*n2x+n1y*n2y));
    let mx=n1x+n2x, my=n1y+n2y;
    const k=1+dot;
    if(k>0.08){ mx/=k; my/=k; }
    else { const l=Math.hypot(mx,my)||1; mx/=l; my/=l; }
    const lim=Math.hypot(mx,my);
    if(lim>MITER && ad>1e-6){
      /* Round join: walk an arc from the first edge normal to the second,
         centred on the original vertex. */
      const a1=Math.atan2(n1y,n1x), a2=Math.atan2(n2y,n2x);
      let sweep=a2-a1;
      while(sweep> Math.PI) sweep-=2*Math.PI;
      while(sweep<-Math.PI) sweep+=2*Math.PI;
      const steps=Math.max(2, Math.min(16, Math.ceil(Math.abs(sweep)/0.35)));
      for(let t=0;t<=steps;t++){
        const ang=a1+sweep*(t/steps);
        out.push({x:p.x+Math.cos(ang)*d, y:p.y+Math.sin(ang)*d});
      }
      continue;
    }
    out.push({x:p.x+mx*d, y:p.y+my*d});
  }
  return out;
}
function roundCorners(c,r){
  if(r<=0) return c;
  const n=c.length, out=[];
  for(let i=0;i<n;i++){
    const p=c[i], a=c[(i-1+n)%n], b=c[(i+1)%n];
    const v1={x:a.x-p.x,y:a.y-p.y}, v2={x:b.x-p.x,y:b.y-p.y};
    const l1=Math.hypot(v1.x,v1.y), l2=Math.hypot(v2.x,v2.y);
    if(l1<1e-6||l2<1e-6){ out.push(p); continue; }
    const cosA=(v1.x*v2.x+v1.y*v2.y)/(l1*l2);
    const ang=Math.acos(Math.max(-1,Math.min(1,cosA)));
    if(ang>2.62){ out.push(p); continue; }
    const t=Math.min(r, l1*0.48, l2*0.48);
    const A={x:p.x+v1.x/l1*t, y:p.y+v1.y/l1*t};
    const B={x:p.x+v2.x/l2*t, y:p.y+v2.y/l2*t};
    const seg=Math.max(3,Math.round(8*(Math.PI-ang)/Math.PI)+3);
    for(let k=0;k<=seg;k++){ const u=k/seg, w=1-u;
      out.push({x:w*w*A.x+2*w*u*p.x+u*u*B.x, y:w*w*A.y+2*w*u*p.y+u*u*B.y}); }
  }
  return out;
}
function shear(c,k){ return c.map(p=>({x:p.x+p.y*k, y:p.y})); }

/* Reference box for the ramp gradient in halftone — the em square and
   the font's own vertical metrics. With an SVG source, the drawing's box. */
function refBox(){
  if(artwork && artwork.contours.length){
    const b=bboxOf(artwork.contours);
    return {cx:(b.x0+b.x1)/2, cy:(b.y0+b.y1)/2,
            hw:Math.max(1,(b.x1-b.x0)/2), hh:Math.max(1,(b.y1-b.y0)/2)};
  }
  const asc =(font&&font.ascender ) || upm*0.78;
  const desc=(font&&font.descender) || -upm*0.22;
  return {cx:upm*0.30, cy:(asc+desc)/2, hw:upm*0.42, hh:Math.max(1,(asc-desc)/2)};
}

/* ── Screens ──
   Both work on a lattice rotated by the screen angle: bounds are taken in
   that rotated frame, sampling happens in world space. */
function rotBounds(cs, th, pad){
  const c=Math.cos(-th), s=Math.sin(-th);
  const b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  for(const cc of cs) for(const p of cc){
    const x=p.x*c-p.y*s, y=p.x*s+p.y*c;
    if(x<b.x0)b.x0=x; if(x>b.x1)b.x1=x;
    if(y<b.y0)b.y0=y; if(y>b.y1)b.y1=y;
  }
  b.x0-=pad; b.y0-=pad; b.x1+=pad; b.y1+=pad;
  return b;
}
const DIAMOND=[{x:0,y:.62},{x:.62,y:0},{x:0,y:-.62},{x:-.62,y:0}];

/* A linear ramp across the reference box, used to fade a screen out. */
function rampAt(x,y,angDeg,R){
  const a=angDeg*Math.PI/180;
  const u=((x-R.cx)/R.hw*Math.cos(a) + (y-R.cy)/R.hh*Math.sin(a));
  return Math.max(0, Math.min(1, 0.5+u*0.5));
}

function screenField(cs, p, spacing){
  const cell=Math.max(upm/420, spacing/8);
  const blurPx=(p.soft*upm/1000)/cell;
  const pad=Math.max(spacing, blurPx*cell*2.2, cell*3);
  const F=buildField(cs, cell, pad, 2);
  if(F && blurPx>=0.5) boxBlur(F, blurPx);
  return F;
}

function halftoneScreen(cs, p){
  const s=upm/Math.max(2,p.freq);
  const F=screenField(cs,p,s); if(!F) return cs;
  const th=p.angle*Math.PI/180, ct=Math.cos(th), st=Math.sin(th);
  const b=rotBounds(cs, th, s*1.5);
  const shape = p.shape==='diamond' ? DIAMOND : (SHAPES[p.shape]||SHAPES.circle);
  const gamma=Math.pow(2, -p.contrast/50), R=refBox();
  const out=[], iMax=Math.ceil(b.x1/s), jMax=Math.ceil(b.y1/s);
  if((iMax-Math.floor(b.x0/s))*(jMax-Math.floor(b.y0/s))>90000) return cs;
  for(let j=Math.floor(b.y0/s); j<=jMax; j++){
    for(let i=Math.floor(b.x0/s); i<=iMax; i++){
      const X=(i+0.5)*s, Y=(j+0.5)*s;
      const x=X*ct-Y*st, y=X*st+Y*ct;
      let v=sample(F,x,y);
      if(v<=0.012) continue;
      v=Math.pow(Math.min(1,v), gamma);
      if(p.ramp) v*=1-(p.ramp/100)*(1-rampAt(x,y,p.rampAngle,R));
      const dd=s*Math.sqrt(Math.max(0,v))*p.dot;
      if(dd<s*0.05) continue;
      out.push(shape.map(q=>{
        const qx=q.x*dd, qy=q.y*dd;
        return {x:x+qx*ct-qy*st, y:y+qx*st+qy*ct};
      }));
    }
  }
  return out.length?out:cs;
}

function lineScreen(cs, p){
  const s=upm/Math.max(2,p.freq);
  const F=screenField(cs,p,s); if(!F) return cs;
  const out=[];
  /* hatch: the second direction only bites where the ink is dense, the way
     an engraver crosses a ruling to darken the shadows and leaves the
     mid-tones on a single set of lines. */
  const angles = p.pattern==='lines' ? [p.angle] : [p.angle, p.angle+90];
  angles.forEach((a,idx)=>ribbons(cs, F, p, s, a*Math.PI/180,
                                  idx ? 0.5 : 0,
                                  p.pattern==='hatch' && idx ? 0.62 : 0, out));
  return out.length?out:cs;
}

/* One ruling: walk along the line and build a ribbon whose half-width
   follows the coverage under it. A break in the coverage closes the ribbon
   and starts a new one, so lines stop at the edge of the ink. */
function ribbons(cs, F, p, s, th, offset, minCov, out){
  const ct=Math.cos(th), st=Math.sin(th);
  const b=rotBounds(cs, th, s*1.2);
  const step=Math.max(F.cell, s/5);
  const gamma=Math.pow(2, -p.contrast/50);
  const half=s*p.weight*0.5;
  const world=(X,Y)=>({x:X*ct-Y*st, y:X*st+Y*ct});
  for(let j=Math.floor(b.y0/s); j<=Math.ceil(b.y1/s); j++){
    const Y=(j+0.5+offset)*s;
    let top=null, bot=null;
    const close=()=>{ if(top && top.length>1) out.push(top.concat(bot.reverse())); top=bot=null; };
    for(let X=b.x0; X<=b.x1; X+=step){
      const w0=world(X,Y);
      let v=sample(F, w0.x, w0.y);
      v=Math.pow(Math.min(1,Math.max(0,v)), gamma);
      if(minCov && v<minCov){ close(); continue; }
      const hw = p.tone==='tonal' ? half*v : (v>0.5 ? half : 0);
      if(hw<=s*0.004){ close(); continue; }
      if(!top){ top=[]; bot=[]; }
      top.push(world(X, Y+hw));
      bot.push(world(X, Y-hw));
    }
    close();
  }
}

function windingSign(cs){
  let best=0, s=1;
  for(const c of cs){ const a=area(c); if(Math.abs(a)>best){ best=Math.abs(a); s=Math.sign(a)||1; } }
  return s;
}

/* ── Extrude ── */
function extrude(cs,dx,dy){
  const s=windingSign(cs), groups=[cs.map(c=>c.slice())];
  groups.push(cs.map(c=>c.map(p=>({x:p.x+dx, y:p.y+dy}))));
  for(const c of cs){
    const n=c.length;
    for(let i=0;i<n;i++){
      const p=c[i], q=c[(i+1)%n];
      const nrx=s*(q.y-p.y), nry=-s*(q.x-p.x);
      if(nrx*dx+nry*dy<=0) continue;
      groups.push([[p,q,{x:q.x+dx,y:q.y+dy},{x:p.x+dx,y:p.y+dy}]]);
    }
  }
  return groups;
}
function extrudeSolid(cs,dist,angle,res){
  const th=angle*Math.PI/180, dx=Math.cos(th)*dist, dy=Math.sin(th)*dist;
  return unionSolid(extrude(cs,dx,dy), res);
}
/* Merge overlapping groups into one silhouette: rasterise each group with
   its own nonzero fill, then re-trace the 0.5 level. Overlaps disappear,
   counters survive. */
function unionSolid(groups, res){
  const all=[].concat(...groups);
  if(!all.length) return all;
  const cell=upm/(res||400);
  const F=buildField(all, cell, cell*3, 1, 0, groups);
  if(!F) return all;
  const out=normalizeWinding(
    marching(F,0.5).map(c=>simplify(c,cell*0.28)).filter(c=>c.length>3));
  return out.length?out:all;
}

/* A signed distance field over the glyph: negative inside the ink, positive
   outside, measured in grid cells. Both the bolder and the echo rings work
   from this — offsetting raw contours self-intersects in concave areas,
   while a level set of the distance field simply cannot. */
function signedDistField(cs, pad, budget, cellMax){
  const b=bboxOf(cs);
  const span=Math.max(b.x1-b.x0, b.y1-b.y0) + pad*2;
  /* upm/260 is the measured sweet spot (~3x faster than a finer grid for
     under 0.5% outline difference). Coarsen only when a large pad — many
     wide rings — would otherwise blow up the cell count, and never past the
     point where the thinnest feature stops being resolvable. */
  let cell=upm/260;
  const cap=budget||420000;
  if((span/cell)*(span/cell) > cap) cell=span/Math.sqrt(cap);
  if(cellMax) cell=Math.min(cell, Math.max(upm/260, cellMax));
  const F=buildField(cs, cell, pad, 1);
  if(!F) return null;
  const {f,w,h}=F;
  const dist=new Float32Array(w*h);
  for(let i=0;i<w*h;i++) dist[i]= f[i]>0.5 ? -1e9 : 1e9;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const inside=f[j*w+i]>0.5;
    let boundary=false;
    if(i>0   && (f[j*w+i-1]>0.5)!==inside) boundary=true;
    if(i<w-1 && (f[j*w+i+1]>0.5)!==inside) boundary=true;
    if(j>0   && (f[(j-1)*w+i]>0.5)!==inside) boundary=true;
    if(j<h-1 && (f[(j+1)*w+i]>0.5)!==inside) boundary=true;
    if(boundary) dist[j*w+i]=0;
  }
  const D1=1, D2=Math.SQRT2;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    let v=Math.abs(dist[j*w+i]);
    if(i>0)        v=Math.min(v, Math.abs(dist[j*w+i-1])+D1);
    if(j>0)        v=Math.min(v, Math.abs(dist[(j-1)*w+i])+D1);
    if(i>0&&j>0)   v=Math.min(v, Math.abs(dist[(j-1)*w+i-1])+D2);
    if(i<w-1&&j>0) v=Math.min(v, Math.abs(dist[(j-1)*w+i+1])+D2);
    dist[j*w+i]=(dist[j*w+i]<0?-1:1)*v;
  }
  for(let j=h-1;j>=0;j--) for(let i=w-1;i>=0;i--){
    let v=Math.abs(dist[j*w+i]);
    if(i<w-1)        v=Math.min(v, Math.abs(dist[j*w+i+1])+D1);
    if(j<h-1)        v=Math.min(v, Math.abs(dist[(j+1)*w+i])+D1);
    if(i<w-1&&j<h-1) v=Math.min(v, Math.abs(dist[(j+1)*w+i+1])+D2);
    if(i>0&&j<h-1)   v=Math.min(v, Math.abs(dist[(j+1)*w+i-1])+D2);
    dist[j*w+i]=(dist[j*w+i]<0?-1:1)*v;
  }
  return {dist, w, h, cell:F.cell, x0:F.x0, y0:F.y0, ytop:F.ytop};
}

/* Outline of the ink grown by d font units (negative shrinks it).
   Marches the distance field directly at level d rather than materialising a
   0..1 copy per ring — with a dozen rings that copy was most of the cost. */
function dilateOutline(DT, d){
  const level={f:DT.dist, w:DT.w, h:DT.h, cell:DT.cell,
               x0:DT.x0, y0:DT.y0, ytop:DT.ytop};
  return normalizeWinding(
    marching(level, d/DT.cell).map(c=>simplify(c, DT.cell*0.28)).filter(c=>c.length>3));
}

/* Bolder that preserves counters (o, e, a, b, d, g, p, q holes). */
function emboldenMorpho(cs, d){
  if(!d) return cs;
  const DT=signedDistField(cs, Math.abs(d)+upm/60);
  if(!DT) return cs;
  const out=dilateOutline(DT, d);
  return out.length ? out : cs;
}

function contourEchoes(cs, cfg){
  const out = cfg.includeCore ? cs.map(c=>c.slice()) : [];
  const half=cfg.thickness*0.5;
  const maxD=cfg.gap*cfg.count + half;
  /* Rings are level sets of the distance field, so they radiate away from
     the INK in every direction at once: outward around the letter, and
     inward toward the middle of each counter. Offsetting the raw contours
     instead sent the counter rings the wrong way and tangled them inside
     tight eyes like 'e' and 'g'. */
  const DT=signedDistField(cs, maxD+upm/40, 420000/Math.sqrt(cfg.count), cfg.thickness/2.2);
  if(!DT) return out;
  for(let k=1;k<=cfg.count;k++){
    const d=cfg.gap*k;
    const outer=dilateOutline(DT, d+half);
    if(!outer.length) continue;
    out.push(...outer);
    for(const c of dilateOutline(DT, d-half)) out.push(c.slice().reverse());
  }
  return out;
}
/* ── Slice ──────────────────────────────────────────────────────
   Cuts contours along N evenly-spaced lines at a given angle, then
   shifts each slab perpendicularly to the cut direction.

   Strategy:
   1. Rotate all contours so the cuts become horizontal.
   2. Find the Y extent, divide it into (cuts+1) bands.
   3. For each band, clip the rotated contours to that band using
      the Sutherland-Hodgman algorithm (two half-plane clips).
   4. Translate the clipped fragment by its per-slab shift.
   5. Rotate everything back.

   Sutherland-Hodgman half-plane clip: keeps the "inside" of a
   line defined by (0,boundary) horizontal, direction given by `side`
   (+1 = keep above, -1 = keep below).
*/
function sliceGlyph(cs, p){
  if(!cs.length) return cs;
  const cuts = Math.max(1, Math.round(p.cuts));
  const shift = p.shift * upm / 1000;
  /* Nullish, not falsy: an angle of 0 is a legitimate setting and `||` was
     quietly turning it into 90. */
  const th = (p.angle ?? 90) * Math.PI / 180;
  const cosA = Math.cos(th), sinA = Math.sin(th);

  /* Rotate about origin */
  const rot = (c, ca, sa) => c.map(({x,y})=>({x: x*ca + y*sa, y: -x*sa + y*ca}));

  /* Sutherland-Hodgman clip of a single closed contour to a horizontal
     half-plane. side=+1 keeps points with y >= boundary; side=-1 keeps y <= boundary */
  function clipHalf(contour, boundary, side){
    if(!contour.length) return [];
    const inside = p => side*(p.y - boundary) >= -1e-9;
    const intersect = (a, b) => {
      const t = (boundary - a.y) / ((b.y - a.y) || 1e-9);
      return {x: a.x + t*(b.x - a.x), y: boundary};
    };
    const out = [];
    const n = contour.length;
    for(let i = 0; i < n; i++){
      const cur = contour[i], prv = contour[(i-1+n)%n];
      const curIn = inside(cur), prvIn = inside(prv);
      if(prvIn && curIn){ out.push(cur); }
      else if(prvIn && !curIn){ out.push(intersect(prv,cur)); }
      else if(!prvIn && curIn){ out.push(intersect(prv,cur)); out.push(cur); }
      // both outside: nothing
    }
    return out;
  }

  /* Clip a multi-contour glyph to a horizontal band [yLo, yHi] */
  function clipBand(contours, yLo, yHi){
    const out = [];
    for(const c of contours){
      const step1 = clipHalf(c, yLo, +1);  // above yLo
      const step2 = clipHalf(step1, yHi, -1); // below yHi
      if(step2.length > 2) out.push(step2);
    }
    return out;
  }

  /* Rotate all contours to make cuts horizontal */
  const rotated = cs.map(c => rot(c, cosA, sinA));

  /* Find Y range */
  let yMin = Infinity, yMax = -Infinity;
  for(const c of rotated) for(const p of c){ yMin = Math.min(yMin, p.y); yMax = Math.max(yMax, p.y); }
  const ySpan = yMax - yMin;
  if(ySpan < 1e-6) return cs;

  /* Per-slab shift amount.
     stagger — the offset walks one way, slab after slab: a staircase.
     wave    — one full sine across the stack, so it leans out and returns. */
  const slabCount = cuts + 1;
  const shiftAmounts = [];
  for(let i = 0; i < slabCount; i++){
    const t = slabCount < 2 ? 0.5 : i / (slabCount - 1);   // 0..1, bottom → top
    const mag = p.pattern === 'wave' ? Math.sin(t * Math.PI * 2) : t;
    shiftAmounts.push(shift * mag);
  }

  /* Evenly spaced cut boundaries */
  const boundaries = [yMin];
  for(let i = 1; i <= cuts; i++) boundaries.push(yMin + (i / (cuts + 1)) * ySpan);
  boundaries.push(yMax);

  /* Clip each slab and shift it */
  const result = [];
  const cosBack = Math.cos(-th), sinBack = Math.sin(-th);
  for(let i = 0; i < slabCount; i++){
    const yLo = boundaries[i], yHi = boundaries[i+1];
    const slabs = clipBand(rotated, yLo - 1e-4, yHi + 1e-4);
    const dx = shiftAmounts[i];
    for(const slab of slabs){
      /* Translate in rotated space (perpendicular to cuts = along X after rotation) */
      const shifted = slab.map(({x,y}) => ({x: x + dx, y}));
      /* Rotate back */
      result.push(rot(shifted, cosBack, sinBack));
    }
  }
  return result.length ? result : cs;
}

/* ══════════════════════════════════════════════════════════════
   3. COVERAGE FIELD
   ══════════════════════════════════════════════════════════════ */
const rc = document.createElement('canvas'), rx = rc.getContext('2d',{colorSpace:'srgb', willReadFrequently:true});

function buildField(contours, cell, pad, ss, stroke, groups){
  const b=bboxOf(contours);
  const x0=Math.floor((b.x0-pad)/cell)*cell, y0=Math.floor((b.y0-pad)/cell)*cell;
  const w=Math.ceil((b.x1+pad-x0)/cell)+1, h=Math.ceil((b.y1+pad-y0)/cell)+1;
  if(w<1||h<1||w*h>900000) return null;
  rc.width=w*ss; rc.height=h*ss;
  rx.clearRect(0,0,rc.width,rc.height);
  rx.fillStyle='#000'; rx.strokeStyle='#000';
  const S=ss/cell;
  const trace=cs=>{ rx.beginPath();
    for(const c of cs){
      rx.moveTo((c[0].x-x0)*S, (h*cell-(c[0].y-y0))*S);
      for(let i=1;i<c.length;i++) rx.lineTo((c[i].x-x0)*S, (h*cell-(c[i].y-y0))*S);
      rx.closePath();
    } };
  if(groups){
    for(const g of groups){ trace(g); rx.fill('nonzero'); }
  } else {
    trace(contours);
    rx.fill('nonzero');
    if(stroke){
      rx.lineJoin='miter'; rx.miterLimit=8; rx.lineWidth=Math.abs(stroke)*2*S;
      if(stroke<0) rx.globalCompositeOperation='destination-out';
      rx.stroke();
      rx.globalCompositeOperation='source-over';
    }
  }
  const img=rx.getImageData(0,0,rc.width,rc.height).data;
  const f=new Float32Array(w*h);
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    let s=0;
    for(let v=0;v<ss;v++) for(let u=0;u<ss;u++) s+=img[(((j*ss+v)*rc.width)+(i*ss+u))*4+3];
    f[j*w+i]=s/(255*ss*ss);
  }
  return {f,w,h,cell,x0,y0,ytop:y0+h*cell};
}

function boxBlur(F,r){
  if(r<0.5) return;
  const {f,w,h}=F, R=Math.round(r), tmp=new Float32Array(f.length);
  for(let pass=0;pass<3;pass++){
    for(let j=0;j<h;j++){ let s=0;
      for(let i=-R;i<=R;i++) s+=f[j*w+Math.max(0,Math.min(w-1,i))];
      for(let i=0;i<w;i++){ tmp[j*w+i]=s/(2*R+1);
        s+=f[j*w+Math.min(w-1,i+R+1)]-f[j*w+Math.max(0,i-R)]; } }
    for(let i=0;i<w;i++){ let s=0;
      for(let j=-R;j<=R;j++) s+=tmp[Math.max(0,Math.min(h-1,j))*w+i];
      for(let j=0;j<h;j++){ f[j*w+i]=s/(2*R+1);
        s+=tmp[Math.min(h-1,j+R+1)*w+i]-tmp[Math.max(0,j-R)*w+i]; } }
  }
}

const hash=(x,y)=>{ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); };

function sample(F,x,y){
  const i=(x-F.x0)/F.cell-0.5, j=(F.ytop-y)/F.cell-0.5;
  const i0=Math.floor(i), j0=Math.floor(j), fx=i-i0, fy=j-j0;
  const g=(a,b)=> (a<0||b<0||a>=F.w||b>=F.h) ? 0 : F.f[b*F.w+a];
  return (g(i0,j0)*(1-fx)+g(i0+1,j0)*fx)*(1-fy)+(g(i0,j0+1)*(1-fx)+g(i0+1,j0+1)*fx)*fy;
}

function marching(F,L){
  const {f,w,h}=F, segs=[];
  const ip=(v1,v2)=>(L-v1)/((v2-v1)||1e-9);
  for(let j=0;j<h-1;j++) for(let i=0;i<w-1;i++){
    const a=f[j*w+i], b=f[j*w+i+1], c=f[(j+1)*w+i+1], d=f[(j+1)*w+i];
    const idx=(a>L?8:0)|(b>L?4:0)|(c>L?2:0)|(d>L?1:0);
    if(idx===0||idx===15) continue;
    const T={x:i+ip(a,b), y:j}, R={x:i+1, y:j+ip(b,c)},
          B={x:i+ip(d,c), y:j+1}, Lp={x:i, y:j+ip(a,d)};
    const add=(p,q)=>segs.push([p,q]);
    switch(idx){
      case 1: add(Lp,B); break;  case 2: add(B,R); break;  case 3: add(Lp,R); break;
      case 4: add(R,T); break;   case 5: add(Lp,T); add(B,R); break;
      case 6: add(B,T); break;   case 7: add(Lp,T); break;  case 8: add(T,Lp); break;
      case 9: add(T,B); break;   case 10: add(T,R); add(B,Lp); break;
      case 11: add(T,R); break;  case 12: add(R,Lp); break; case 13: add(R,B); break;
      case 14: add(B,Lp); break;
    }
  }
  const key=p=>Math.round(p.x*4096)+','+Math.round(p.y*4096);
  const start=new Map();
  segs.forEach((s,i)=>{ const k=key(s[0]); (start.get(k)||start.set(k,[]).get(k)).push(i); });
  const used=new Array(segs.length).fill(false), out=[];
  for(let i=0;i<segs.length;i++){
    if(used[i]) continue;
    const c=[segs[i][0]]; let cur=i;
    while(cur!==undefined && !used[cur]){
      used[cur]=true; c.push(segs[cur][1]);
      const nx=(start.get(key(segs[cur][1]))||[]).find(k=>!used[k]);
      cur=nx;
    }
    if(c.length>3) out.push(c);
  }
  return out.map(c=>c.map(p=>({x:F.x0+p.x*F.cell, y:F.ytop-p.y*F.cell})));
}

/* Marching squares returns contours whose winding is the opposite of the
   font convention. SVG's nonzero rule doesn't care, but OTF export does —
   a flipped outer contour makes counters fill in. So: force the biggest
   contour positive and flip everything with it. */
function normalizeWinding(cs){
  if(!cs.length) return cs;
  let biggest=0, sign=1;
  for(const c of cs){
    const a=area(c);
    if(Math.abs(a)>biggest){ biggest=Math.abs(a); sign=Math.sign(a)||1; }
  }
  return sign>0 ? cs : cs.map(c=>c.slice().reverse());
}

function simplify(c,tol){
  if(c.length<8) return c;
  const closed=Math.hypot(c[0].x-c[c.length-1].x, c[0].y-c[c.length-1].y)<1e-6;
  if(closed){
    let mi=1, md=-1;
    for(let i=1;i<c.length-1;i++){ const d=Math.hypot(c[i].x-c[0].x, c[i].y-c[0].y); if(d>md){md=d;mi=i;} }
    return dp(c.slice(0,mi+1),tol).slice(0,-1).concat(dp(c.slice(mi),tol).slice(0,-1));
  }
  return dp(c,tol);
}
function dp(c,tol){
  if(c.length<3) return c;
  const keep=new Array(c.length).fill(false); keep[0]=keep[c.length-1]=true;
  const st=[[0,c.length-1]];
  while(st.length){
    const [a,b]=st.pop(); if(b-a<2) continue;
    const p=c[a], q=c[b]; const dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy)||1;
    let mi=-1, md=tol;
    for(let i=a+1;i<b;i++){
      const d=Math.abs((c[i].x-p.x)*dy-(c[i].y-p.y)*dx)/L;
      if(d>md){ md=d; mi=i; }
    }
    if(mi>0){ keep[mi]=true; st.push([a,mi],[mi,b]); }
  }
  return c.filter((_,i)=>keep[i]);
}

/* ══════════════════════════════════════════════════════════════
   4. PIXEL SHAPES + SCREENING
   ══════════════════════════════════════════════════════════════ */
const SHAPES={
  square:[{x:-.5,y:-.5},{x:.5,y:-.5},{x:.5,y:.5},{x:-.5,y:.5}],
  circle:Array.from({length:28},(_,i)=>{const a=i/28*Math.PI*2;return{x:Math.cos(a)*.5,y:Math.sin(a)*.5};}),
  triangle:[{x:0,y:.58},{x:.5,y:-.29},{x:-.5,y:-.29}]
};

/* Warp a unit shape (coords in [-0.5,0.5]) through an 8-handle distortion:
   4 corners plus 4 edge midpoints. The corners pin the quad; the edge
   handles bow each side in or out, which is what lets you squeeze or
   expand the shape rather than only skew it.

   Each edge is a quadratic Bézier passing exactly through its handle, and
   the interior is filled with a Coons patch so the deformation stays
   smooth and reduces to the plain quad when the edge handles sit at rest. */
/* An Illustrator-style transform box for the pixel shape.

   Corners are free: each one moves on its own, which is what distorts the
   shape into an arbitrary quad.

   Sides are NOT free points. Dragging a side handle scales the whole shape
   along that axis, anchored to the opposite side — the same as dragging a
   bounding-box handle in Illustrator. Alt scales about the centre instead.
   The anchoring is already baked into sx/tx by the drag handler, so here we
   only apply the resulting scale and offset.

   Rotation spins the whole thing about the box centre.

   Chain: corner distort -> axis scale (+ anchor offset) -> rotate. */
function warpShape(shape, w){
  const TL={x:-0.5+w.tl[0], y: 0.5+w.tl[1]};
  const TR={x: 0.5+w.tr[0], y: 0.5+w.tr[1]};
  const BR={x: 0.5+w.br[0], y:-0.5+w.br[1]};
  const BL={x:-0.5+w.bl[0], y:-0.5+w.bl[1]};
  const sx=w.sx, sy=w.sy, tx=w.tx, ty=w.ty;
  const th=w.rot*Math.PI/180, cs=Math.cos(th), sn=Math.sin(th);
  return shape.map(p=>{
    const u=p.x+0.5, v=p.y+0.5;          // v=0 bottom, v=1 top
    // 1. free-corner distort (bilinear over the quad)
    const dx=(1-u)*(1-v)*BL.x + u*(1-v)*BR.x + (1-u)*v*TL.x + u*v*TR.x;
    const dy=(1-u)*(1-v)*BL.y + u*(1-v)*BR.y + (1-u)*v*TL.y + u*v*TR.y;
    // 2. scale along each axis, plus the offset that keeps the anchor put
    const ax=dx*sx+tx, ay=dy*sy+ty;
    // 3. rotate about the box centre
    const rx=ax-tx, ry=ay-ty;
    return {x:tx+rx*cs-ry*sn, y:ty+rx*sn+ry*cs};
  });
}

const WARP_CORNERS=['tl','tr','br','bl'];
const WARP_SIDES=['tm','bm','lm','rm'];
const WARP_KEYS=WARP_CORNERS.concat(WARP_SIDES);

/* Gather the transform out of the effect's flat parameter bag. */
function warpOf(p){
  const w={sx:p.warpSX===undefined?1:p.warpSX, sy:p.warpSY===undefined?1:p.warpSY,
           tx:p.warpTX||0, ty:p.warpTY||0, rot:p.warpROT||0};
  for(const k of WARP_CORNERS){
    const K=k.toUpperCase();
    w[k]=[p['warp'+K+'x']||0, p['warp'+K+'y']||0];
  }
  return w;
}
const hasWarp = w => !!w && (
  WARP_CORNERS.some(k=> w[k] && (w[k][0] || w[k][1]) ) ||
  w.sx!==1 || w.sy!==1 || w.tx!==0 || w.ty!==0 || w.rot!==0 );

/* Where each handle sits, in shape space, for the current transform. */
function warpHandlePoints(w){
  const src={tl:{x:-0.5,y:0.5}, tr:{x:0.5,y:0.5}, br:{x:0.5,y:-0.5}, bl:{x:-0.5,y:-0.5},
             tm:{x:0,y:0.5},    bm:{x:0,y:-0.5},  lm:{x:-0.5,y:0},   rm:{x:0.5,y:0}};
  const pts={}, keys=WARP_KEYS;
  const mapped=warpShape(keys.map(k=>src[k]), w);
  keys.forEach((k,i)=>pts[k]=mapped[i]);
  return pts;
}

/* Undo rotate+scale to get back to distort space — used while dragging. */
function warpUnproject(P, w){
  const th=-w.rot*Math.PI/180, cs=Math.cos(th), sn=Math.sin(th);
  const rx=P.x-w.tx, ry=P.y-w.ty;
  const ux=w.tx+rx*cs-ry*sn, uy=w.ty+rx*sn+ry*cs;   // un-rotated
  return {x:(ux-w.tx)/(w.sx||1e-6), y:(uy-w.ty)/(w.sy||1e-6), ux, uy};
}

/* Dot screen used by PIXEL */
function dotScreen(F,cfg){
  const out=[], s=cfg.spacing, thr=cfg.threshold, sc=cfg.scatter;
  const bx0=F.x0, bx1=F.x0+F.w*F.cell, by0=F.ytop-F.h*F.cell, by1=F.ytop;
  let base = cfg.shape==='custom' && cfg.custom ? cfg.custom : [SHAPES[cfg.shape]||SHAPES.square];
  if(hasWarp(cfg.warp)) base = base.map(sh=>warpShape(sh, cfg.warp));
  const mod = v => Math.min(1, v/Math.max(.05,thr));
  for(let bj=0; by0+(bj+0.5)*s<=by1; bj++){
    for(let bi=0; bx0+(bi+0.5)*s<=bx1; bi++){
      let x=bx0+(bi+0.5)*s, y=by0+(bj+0.5)*s;
      const v=sample(F,x,y); if(v<thr) continue;
      if(sc>0 && hash(bi*3.1+7,bj*5.7+3)>Math.min(1,v*1.7)) continue;
      if(sc>0){ x+=(hash(bi*1.7,bj*2.3)-0.5)*s*sc*2;
                y+=(hash(bj*1.9,bi*2.7)-0.5)*s*sc*2; }
      const d=s*cfg.gap*(cfg.modulate?mod(v)*0.55+0.45:1);
      for(const sh of base) out.push(sh.map(p=>({x:x+p.x*d, y:y+p.y*d})));
    }
  }
  return out;
}

/* Isolines / blurred outline used by BLUR */
/* Posterised blur: slice the soft falloff into n filled concentric steps.
   Each band is the region between two thresholds — the lower one gives the
   outer edge, the higher one is reversed to carve the inside out, so nonzero
   fill leaves a clean ring rather than a solid blob. `spread` is the duty
   cycle: how much of each step is ink versus gap. */
function levelBands(F, n, cell){
  /* Absolute thresholds on purpose: tying them to the field's peak packed the
     steps into a narrow slice of the gradient and turned the bands into
     hairlines. Darkness already moves the gradient under them. */
  const out=[], lo=0.08, hi=0.94, duty=0.5;
  const cut=f=>Math.min(0.985, Math.max(0.02, f));
  const at=L=>normalizeWinding(
    marching(F,L).map(c=>simplify(c,cell*0.3)).filter(c=>c.length>3));
  for(let k=0;k<n;k++){
    const tOut = cut(lo + (hi-lo)*(k/n));
    const tIn  = cut(lo + (hi-lo)*((k+duty)/n));
    const outer=at(tOut);
    if(!outer.length) continue;
    out.push(...outer);
    for(const c of at(tIn)) out.push(c.slice().reverse());
  }
  return out;
}

/* The blurred field rarely reaches 1, so thresholds are taken as a fraction
   of its own peak — that alone keeps thin strokes from breaking up under a
   heavy blur. */
function fieldPeak(F){
  let peak=0;
  for(let i=0;i<F.f.length;i++) if(F.f[i]>peak) peak=F.f[i];
  return peak||1;
}

/* Darkness reshapes the falloff itself with a gamma curve, rather than moving
   the cut-off. Moving the cut-off also squeezed the gap between successive
   levels, so bands got thinner as you darkened them. Gamma leaves the
   thresholds where they are and swells or shrinks the gradient underneath, so
   every reading of it — plain, levels, isolines — gets heavier together.
   Because thresholds are peak-relative and gamma is monotonic, the ink can
   never vanish entirely at the light end. */
function applyDarkness(F, d){
  if(!d) return;
  const g=Math.pow(2, -d/60);
  for(let i=0;i<F.f.length;i++){
    const v=F.f[i];
    if(v>0 && v<1) F.f[i]=Math.pow(v,g);
  }
}

function isolines(F,B,cell){
  const n=Math.round(B.rings||0);
  const plain=L=>marching(F,L).map(c=>simplify(c,cell*0.3)).filter(c=>c.length>3);
  const peak=fieldPeak(F);
  const cut=f=>Math.min(0.985, Math.max(0.02, peak*f));
  if(n<1) return plain(cut(0.5));
  const t=Math.max(3,B.thickness)*upm/2000;
  let out=[];
  for(let k=0;k<n;k++){
    const L = cut(n===1 ? 0.5 : 0.08+k*(0.9-0.08)/(n-1));
    for(const c of plain(L)){
      const s=Math.sign(area(c))||1;
      out.push(offsetContour(c,t,s), offsetContour(c,-t,s).reverse());
    }
  }
  return out;
}

/* STIPPLE — uniform dot size */
function stipple(F,cfg){
  const out=[], b={x0:F.x0,y0:F.ytop-F.h*F.cell,x1:F.x0+F.w*F.cell,y1:F.ytop};
  const A=(b.x1-b.x0)*(b.y1-b.y0);
  const N=Math.min(60000, Math.round(A/(upm*upm)*cfg.density*900));
  const r=cfg.size*upm/1000, disc=SHAPES.circle;
  for(let k=0;k<N;k++){
    const x=b.x0+hash(k*1.37,k*0.11)*(b.x1-b.x0);
    const y=b.y0+hash(k*0.71,k*2.19)*(b.y1-b.y0);
    const v=sample(F,x,y); if(v<=0.02) continue;
    if(hash(k*5.3+1,k*3.9+2)>v) continue;
    out.push(disc.map(p=>({x:x+p.x*r*2, y:y+p.y*r*2})));
  }
  return out;
}

/* STIPPLE with blur — dot size follows the blurred coverage */
function blurStipple(F,cfg){
  const out=[], b={x0:F.x0,y0:F.ytop-F.h*F.cell,x1:F.x0+F.w*F.cell,y1:F.ytop};
  const A=(b.x1-b.x0)*(b.y1-b.y0);
  const N=Math.min(70000, Math.round(A/(upm*upm)*cfg.density*1000));
  const rMax=cfg.sizeMax*upm/1000, rMin=cfg.sizeMin*upm/1000, disc=SHAPES.circle;
  for(let k=0;k<N;k++){
    const x=b.x0+hash(k*1.37,k*0.11)*(b.x1-b.x0);
    const y=b.y0+hash(k*0.71,k*2.19)*(b.y1-b.y0);
    const v=sample(F,x,y); if(v<=0.02) continue;
    if(hash(k*5.3+1,k*3.9+2)>v) continue;
    const rr=rMin+(rMax-rMin)*v;
    out.push(disc.map(p=>({x:x+p.x*rr*2, y:y+p.y*rr*2})));
  }
  return out;
}

/* Custom shape import (SVG or raster) */
function normalize(cs){
  const b=bboxOf(cs), w=b.x1-b.x0, h=b.y1-b.y0, s=1/Math.max(w,h,1e-6);
  const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2;
  return cs.map(c=>c.map(p=>({x:(p.x-cx)*s, y:(p.y-cy)*s})));
}
function parseD(d){
  if(!d) return [];
  const toks=d.match(/[a-zA-Z]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi)||[];
  const cmds=[]; let i=0, cmd='', x=0,y=0,sx=0,sy=0;
  const num=()=>parseFloat(toks[i++]);
  while(i<toks.length){
    if(/[a-zA-Z]/.test(toks[i])) cmd=toks[i++];
    const rel=cmd===cmd.toLowerCase(), C=cmd.toUpperCase();
    if(C==='M'){ const a=num(),b=num(); x=rel?x+a:a; y=rel?y+b:b; sx=x; sy=y; cmds.push({type:'M',x,y}); cmd=rel?'l':'L'; }
    else if(C==='L'){ const a=num(),b=num(); x=rel?x+a:a; y=rel?y+b:b; cmds.push({type:'L',x,y}); }
    else if(C==='H'){ const a=num(); x=rel?x+a:a; cmds.push({type:'L',x,y}); }
    else if(C==='V'){ const a=num(); y=rel?y+a:a; cmds.push({type:'L',x,y}); }
    else if(C==='C'){ const a=num(),b=num(),c=num(),dd=num(),e=num(),f=num();
      const x1=rel?x+a:a,y1=rel?y+b:b,x2=rel?x+c:c,y2=rel?y+dd:dd; x=rel?x+e:e; y=rel?y+f:f;
      cmds.push({type:'C',x1,y1,x2,y2,x,y}); }
    else if(C==='S'||C==='Q'){ const a=num(),b=num(),c=num(),dd=num();
      const x1=rel?x+a:a,y1=rel?y+b:b; x=rel?x+c:c; y=rel?y+dd:dd; cmds.push({type:'Q',x1,y1,x,y}); }
    else if(C==='T'){ const a=num(),b=num(); x=rel?x+a:a; y=rel?y+b:b; cmds.push({type:'L',x,y}); }
    else if(C==='A'){ num();num();num();num();num(); const e=num(),f=num(); x=rel?x+e:e; y=rel?y+f:f; cmds.push({type:'L',x,y}); }
    else if(C==='Z'){ cmds.push({type:'Z'}); x=sx; y=sy; }
    else i++;
  }
  return flatten(cmds,2).map(c=>c.map(p=>({x:p.x,y:-p.y})));
}

/* ══════════════════════════════════════════════════════════════
   5. PIPELINE
   ══════════════════════════════════════════════════════════════ */
const cache=new Map();
function stackStamp(){
  return bakeVersion+'|'+JSON.stringify(stack.map(e=>[e.id,e.type,e.on,e.baked,e.p]));
}
function invalidate(){ cache.clear(); render(); }

function baseGlyph(g){
  if(baseOverride && baseOverride.has(g.index)) return baseOverride.get(g.index).map(c=>c.slice());
  return flatten(g.path.commands, upm/60);
}
function processGlyph(g){
  const k=stackStamp()+'|'+(baseOverride?'d':'')+'|'+g.index;
  if(cache.has(k)) return cache.get(k);
  let cs=baseGlyph(g);
  for(const inst of stack){
    if(inst.baked || !inst.on || !cs.length) continue;
    try{ cs=REGISTRY[inst.type].apply(cs, inst.p); }catch(err){ console.warn(inst.type,err); }
  }
  cache.set(k,cs);
  return cs;
}
const dPath = cs => cs.map(c=>'M'+c.map(p=>p.x.toFixed(1)+' '+p.y.toFixed(1)).join('L')+'Z').join('');

/* ══════════════════════════════════════════════════════════════
   6. RENDERING
   The text box was the weak point of the old build: the SVG and the
   textarea overlay used different metrics, so the caret drifted away
   from the glyphs. Everything below derives from the same three
   constants, and syncEditor() pushes them onto the textarea so the
   caret always lands where the letters are.
   ══════════════════════════════════════════════════════════════ */
const PAD_EM    = 0.12;   // padding (top & sides) in em
const LINE_LH   = 1.22;   // line-height ratio
const ASC_RATIO = 0.78;   // approximate ascender height in em

function syncEditor(){
  const size = +document.getElementById('size').value;
  const ed = document.getElementById('text');
  ed.style.fontSize      = size + 'px';
  ed.style.lineHeight    = LINE_LH;
  ed.style.letterSpacing = (cfg.tracking * size / 1000) + 'px';
  ed.style.textAlign     = cfg.align;
  ed.style.padding       = (PAD_EM * size) + 'px';
}

function layout(text){
  const items=[]; let pen=0;
  const trackUnits = cfg.tracking * upm / 1000;
  for(const ch of text){
    const g=font.charToGlyph(ch);
    if(ch!==' ') items.push({d:dPath(processGlyph(g).map(c=>c.map(p=>({x:p.x+pen,y:p.y}))))});
    pen += (g.advanceWidth || upm*0.35) + trackUnits;
  }
  return {items, width:pen};
}

/* Width of a run of characters, in font units, including tracking. */
function runWidth(str){
  const trackUnits = cfg.tracking * upm / 1000;
  let w=0;
  for(const ch of str) w += (font.charToGlyph(ch).advanceWidth || upm*0.35) + trackUnits;
  return w;
}

/* Greedy word wrap that mirrors what the browser does to the textarea:
   break on spaces first, then hard-break any word too long for one line. */
function wrapLine(text, maxW){
  if(!text) return [''];
  const out=[];
  let line='';
  const words=text.split(' ');
  for(let i=0;i<words.length;i++){
    const word=words[i];
    const candidate = line==='' ? word : line+' '+word;
    if(runWidth(candidate) <= maxW || line===''){
      // Word itself may still overflow an empty line → hard-break it.
      if(line==='' && runWidth(word) > maxW){
        let chunk='';
