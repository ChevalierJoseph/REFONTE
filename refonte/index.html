        for(const ch of word){
          if(runWidth(chunk+ch) > maxW && chunk!==''){ out.push(chunk); chunk=ch; }
          else chunk+=ch;
        }
        line=chunk;
        continue;
      }
      line=candidate;
    } else {
      out.push(line);
      i--;             // retry this word on the fresh line
      line='';
    }
  }
  out.push(line);
  return out;
}

function renderPreview(){
  const svg=document.getElementById('preview');
  const box=document.getElementById('canvasbox');
  const ed=document.getElementById('text');
  box.style.background = cfg.colorBg || '';
  if(artwork){ renderArtworkPreview(); return; }
  if(!ready){ svg.innerHTML=''; return; }
  const size=+document.getElementById('size').value;
  const rect=box.getBoundingClientRect();
  const scale=size/upm;

  /* Everything below works in font units. The viewBox is locked to the box
     size so 1 font unit always maps to `scale` CSS px — the same scale the
     textarea uses. That is what keeps the caret on the glyphs. */
  const W = rect.width/scale;
  const H = rect.height/scale;
  const pad = PAD_EM*upm;
  const contentW = Math.max(1, W - 2*pad);

  /* Same wrapping the textarea performs, applied to each hard line. */
  const visual=[];
  for(const hard of ed.value.split('\n')){
    for(const vl of wrapLine(hard, contentW)) visual.push(vl);
  }

  let g='', y=0;
  for(const ln of visual){
    const L=layout(ln);
    let xOff = pad;
    if(cfg.align === 'center')     xOff = pad + (contentW - L.width)/2;
    else if(cfg.align === 'right') xOff = pad + (contentW - L.width);
    g += `<g transform="translate(${xOff} ${y})">`+L.items.map(it=>`<path d="${it.d}"/>`).join('')+`</g>`;
    y -= upm*LINE_LH;
  }

  /* First baseline sits PAD_EM + ASC_RATIO em below the top edge — exactly
     where the textarea puts its own first baseline. Scrolling the textarea
     shifts the viewBox by the same amount so the two stay locked together. */
  const scrollUnits = ed.scrollTop / scale;
  svg.setAttribute('viewBox', `0 ${-(pad + upm*ASC_RATIO) + scrollUnits} ${W} ${H}`);
  const inkColor = cfg.colorInk || themeInk();
  svg.innerHTML = `<g transform="scale(1,-1)" style="fill:${inkColor}">${g}</g>`;
}

let raf, gridTimer, gridToken=0;

function renderGrid(){
  const grid=document.getElementById('grid');
  if(artwork){ grid.innerHTML=''; return; }   /* no charset to proof */
  grid.style.background = cfg.colorBg || '';
  grid.innerHTML=CHARSET.map(c=>`<div class="cell" data-ch="${c.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" style="background:${cfg.colorBg||''}"></div>`).join('');
  if(!ready) return;
  /* A previous incremental fill may still be running — token it out so the
     two don't interleave into the same cells. */
  const myToken = ++gridToken;
  const cells=[...grid.children]; let i=0;

  /* Every cell shares ONE scale, so the glyphs keep their real proportions:
     a full cap stands taller than an x-height letter, and a period stays a
     period. Sizing each glyph to its own box made them all the same size,
     which is exactly the inconsistency to avoid.

     The common box is measured as we go and the cells are redrawn once at
     the end, so the grid still fills progressively instead of sitting blank
     while a heavy effect is computed. */
  const paths=new Array(CHARSET.length).fill(null);
  const boxes=new Array(CHARSET.length).fill(null);
  let gx=1e9, gy0=1e9, gy1=-1e9, gw=1;

  const draw=(k)=>{
    const b=boxes[k]; if(!b) return;
    const pad=(gy1-gy0)*0.10;
    /* Square viewport: tall enough for the whole alphabet's vertical range,
       wide enough for the widest glyph. */
    const s=Math.max(gy1-gy0, gw)+pad*2;
    const cx=(b.x0+b.x1)/2;                 // centre each glyph horizontally
    const cy=(gy0+gy1)/2;                   // but hold one baseline for all
    const inkCol = cfg.colorInk || themeInk();
    cells[k].innerHTML=`<svg viewBox="${(cx-s/2).toFixed(1)} ${(-(cy+s/2)).toFixed(1)} ${s.toFixed(1)} ${s.toFixed(1)}">`+
      `<g transform="scale(1,-1)" style="fill:${inkCol}"><path d="${paths[k]}"/></g></svg>`;
  };

  (function step(){
    if(myToken !== gridToken) return;
    const t0=performance.now();
    while(i<CHARSET.length && performance.now()-t0<28){
      const g=font.charToGlyph(CHARSET[i]);
      const cs=processGlyph(g);
      if(cs.length){
        const b=bboxOf(cs);
        boxes[i]=b; paths[i]=dPath(cs);
        gy0=Math.min(gy0,b.y0); gy1=Math.max(gy1,b.y1);
        gw=Math.max(gw, b.x1-b.x0);
        draw(i);
      }
      i++;
    }
    if(i<CHARSET.length){ setTimeout(step,0); return; }
    /* Final pass: the common box is settled, so restate every cell against
       it. Cheap — the outlines are already computed and stringified. */
    for(let k=0;k<CHARSET.length;k++) draw(k);
  })();
}
/* The preview holds a handful of glyphs; the grid holds the whole charset.
   Dragging a slider must not pay for the grid on every frame, so the preview
   repaints immediately and the grid follows once the value settles. */
function render(){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(renderPreview);
  clearTimeout(gridTimer);
  gridTimer=setTimeout(renderGrid, 180);
}
function renderNow(){ cancelAnimationFrame(raf); clearTimeout(gridTimer); renderPreview(); renderGrid(); }

/* ══════════════════════════════════════════════════════════════
   6b. SVG SOURCE
   Shapes are read into the same contour format the glyph pipeline
   uses, scaled to cap height and sat on the baseline — so every
   effect, the montage and the SVG export work unchanged.
   ══════════════════════════════════════════════════════════════ */
function svgTextToContours(txt){
  const doc=new DOMParser().parseFromString(txt,'image/svg+xml');
  if(doc.querySelector('parsererror')) return [];
  let cs=[];
  doc.querySelectorAll('path').forEach(el=> cs=cs.concat(parseD(el.getAttribute('d'))));
  doc.querySelectorAll('polygon,polyline').forEach(el=>{
    const pts=(el.getAttribute('points')||'').trim().split(/[\s,]+/).map(Number);
    const c=[]; for(let i=0;i<pts.length-1;i+=2) c.push({x:pts[i],y:-pts[i+1]});
    if(c.length>2) cs.push(c); });
  doc.querySelectorAll('rect').forEach(el=>{
    const x=+el.getAttribute('x')||0, y=+el.getAttribute('y')||0,
          w=+el.getAttribute('width')||0, h=+el.getAttribute('height')||0;
    if(w&&h) cs.push([{x,y:-y},{x:x+w,y:-y},{x:x+w,y:-y-h},{x,y:-y-h}]); });
  doc.querySelectorAll('circle,ellipse').forEach(el=>{
    const cx=+el.getAttribute('cx')||0, cy=+el.getAttribute('cy')||0,
          rx=+(el.getAttribute('rx')||el.getAttribute('r'))||0,
          ry=+(el.getAttribute('ry')||el.getAttribute('r'))||0;
    if(rx&&ry) cs.push(Array.from({length:48},(_,i)=>{const a=i/48*Math.PI*2;
      return {x:cx+Math.cos(a)*rx, y:-(cy+Math.sin(a)*ry)};})); });
  return cs.filter(c=>c.length>2);
}

/* An imported drawing has no winding convention: a counter drawn the same
   way round as its container fills in. Nest the contours and alternate. */
function orientForHoles(cs){
  const inside=(pt,c)=>{
    let hit=false;
    for(let i=0,j=c.length-1;i<c.length;j=i++){
      const a=c[i], b=c[j];
      if((a.y>pt.y)!==(b.y>pt.y) &&
         pt.x < (b.x-a.x)*(pt.y-a.y)/((b.y-a.y)||1e-9)+a.x) hit=!hit;
    }
    return hit;
  };
  return cs.map(c=>{
    let depth=0;
    for(const o of cs) if(o!==c && inside(c[0], o)) depth++;
    const want = depth%2 ? -1 : 1;
    return (Math.sign(area(c))||1)===want ? c : c.slice().reverse();
  });
}

function setArtwork(cs, name){
  if(!cs||!cs.length){ setNote('SVG unreadable — needs paths or basic shapes.'); return; }
  cs=orientForHoles(cs);
  const b=bboxOf(cs);
  const s=(upm*0.72)/Math.max(1e-6, b.y1-b.y0);      // stands cap-height tall
  artwork={ name,
    contours: cs.map(c=>c.map(p=>({x:(p.x-b.x0)*s, y:(p.y-b.y0)*s}))),
    width:(b.x1-b.x0)*s };
  document.body.classList.add('artwork');
  const chip=document.getElementById('svgChipName'); if(chip) chip.textContent=name;
  const gc=document.getElementById('glyphCount');
  if(gc) gc.textContent=artwork.contours.length+' contours';
  setFontLabel(name); setNote('SVG loaded');
  syncExportState();
  cache.clear(); renderNow();
}
function clearArtwork(silent){
  if(!artwork) return;
  artwork=null;
  document.body.classList.remove('artwork');
  const gc=document.getElementById('glyphCount');
  if(gc && font) gc.textContent=(font.numGlyphs||'—')+' glyphs';
  setFontLabel(font ? fontName : '—');
  syncExportState();
  if(!silent){ setNote('Back to text'); cache.clear(); renderNow(); }
}
/* .otf export writes a charset — meaningless for a single drawing. */
function syncExportState(){
  const b=document.getElementById('otfBtn');
  if(b){ b.disabled=!!artwork; b.title=artwork?'Load a font to export .otf':''; }
}
/* Same stack, applied to the drawing. Baked steps are replayed from the
   original outlines, since baking only rewrites glyph bases. */
function processArtwork(){
  const k=stackStamp()+'|artwork';
  if(cache.has(k)) return cache.get(k);
  let cs=artwork.contours.map(c=>c.map(p=>({x:p.x,y:p.y})));
  for(const inst of stack){
    if(!inst.on || !cs.length) continue;
    try{ cs=REGISTRY[inst.type].apply(cs, inst.p); }catch(err){ console.warn(inst.type,err); }
  }
  cache.set(k,cs);
  return cs;
}
function renderArtworkPreview(){
  const svg=document.getElementById('preview'), box=document.getElementById('canvasbox');
  const size=+document.getElementById('size').value, scale=size/upm;
  const rect=box.getBoundingClientRect();
  const W=rect.width/scale, H=rect.height/scale, pad=PAD_EM*upm;
  const contentW=Math.max(1, W-2*pad);
  const cs=processArtwork();
  if(!cs.length){ svg.innerHTML=''; return; }
  const b=bboxOf(cs), w=b.x1-b.x0;
  let xOff=pad-b.x0;
  if(cfg.align==='center')     xOff=pad+(contentW-w)/2-b.x0;
  else if(cfg.align==='right') xOff=pad+contentW-w-b.x0;
  svg.setAttribute('viewBox', `0 ${-(pad+upm*ASC_RATIO)} ${W} ${H}`);
  const artInk = cfg.colorInk || themeInk();
  svg.innerHTML=`<g transform="scale(1,-1)" style="fill:${artInk}">`+
    `<g transform="translate(${xOff} 0)"><path d="${dPath(cs)}"/></g></g>`;
}
function exportArtworkSVG(){
  const cs=processArtwork(); if(!cs.length) return;
  const b=bboxOf(cs), m=upm*0.06, W=(b.x1-b.x0)+2*m, H=(b.y1-b.y0)+2*m;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${(b.x0-m).toFixed(1)} ${(-(b.y1+m)).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}">`+
    `<rect x="${(b.x0-m).toFixed(1)}" y="${(-(b.y1+m)).toFixed(1)}" width="${W.toFixed(1)}" height="${H.toFixed(1)}" fill="${cfg.colorBg||'#ffffff'}"/>`+
    `<g transform="scale(1,-1)" fill="${cfg.colorInk||'#000000'}"><path d="${dPath(cs)}"/></g></svg>`;
  dl(new Blob([svg],{type:'image/svg+xml'}), fname()+'.svg');
}

/* ══════════════════════════════════════════════════════════════
   7. EXPORTS
   ══════════════════════════════════════════════════════════════ */
function exportSVG(){
  if(artwork) return exportArtworkSVG();
  if(!ready) return;
  const lines=document.getElementById('text').value.split('\n');
  let g='', y=0, maxW=0;
  const laidOut=[], widths=[];
  for(const ln of lines){ const L=layout(ln); maxW=Math.max(maxW,L.width); laidOut.push(L); widths.push(L.width); }
  for(let i=0;i<laidOut.length;i++){
    const L=laidOut[i], w=widths[i];
    let xOff=0;
    if(cfg.align === 'center')     xOff=(maxW-w)/2;
    else if(cfg.align === 'right') xOff=maxW-w;
    g+=`<g transform="translate(${xOff} ${y})">`+L.items.map(it=>`<path d="${it.d}"/>`).join('')+`</g>`;
    y-=upm*LINE_LH;
  }
  const H=upm*LINE_LH*lines.length;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 ${-upm*0.85} ${maxW} ${H}">`+
    `<rect x="0" y="${-upm*0.85}" width="${maxW}" height="${H}" fill="${cfg.colorBg||'#ffffff'}"/>`+
    `<g transform="scale(1,-1)" fill="${cfg.colorInk||'#000000'}">${g}</g></svg>`;
  dl(new Blob([svg],{type:'image/svg+xml'}), fname()+'.svg');
}
function exportOTF(){
  if(artwork){ setNote('OTF needs a font — the SVG exports as .svg.'); return; }
  if(!ready) return;
  const trackUnits = cfg.tracking * upm / 1000;
  const glyphs=[new opentype.Glyph({name:'.notdef',unicode:0,advanceWidth:upm*0.5,path:new opentype.Path()})];
  for(const ch of CHARSET){
    const src=font.charToGlyph(ch), p=new opentype.Path();
    for(const c of processGlyph(src)){ p.moveTo(c[0].x,c[0].y);
      for(let i=1;i<c.length;i++) p.lineTo(c[i].x,c[i].y); p.close(); }
    const advance = Math.max(1, (src.advanceWidth||upm*0.5) + trackUnits);
    glyphs.push(new opentype.Glyph({name:src.name||('uni'+ch.charCodeAt(0)),
      unicode:ch.charCodeAt(0), advanceWidth:advance, path:p}));
  }
  const spaceAdv = Math.max(1, (font.charToGlyph(' ').advanceWidth||upm*0.3) + trackUnits);
  glyphs.push(new opentype.Glyph({name:'space',unicode:32,advanceWidth:spaceAdv,path:new opentype.Path()}));
  const out=new opentype.Font({familyName:fname(), styleName:'Regular', unitsPerEm:upm,
    ascender:font.ascender, descender:font.descender, glyphs});
  dl(new Blob([out.toArrayBuffer()],{type:'font/otf'}), fname()+'.otf');
}
const fname=()=>{
  const label = document.getElementById('fontLabel').textContent.trim();
  const base = label && label !== '—' ? label.replace(/\.[a-z]+$/i,'').replace(/\s+/g,'-') : 'Font';
  return base + '-Refonte';
};
function dl(blob,fn){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }

/* ══════════════════════════════════════════════════════════════
   7b. MONTAGE — keyframes, playback, GIF / MP4 export

   The keyframe model is "poses": a keyframe stores a snapshot of the
   whole effect stack. You set up a look, drop a key, change the sliders,
   drop another — and the two are interpolated. That fits how these
   effects are actually dialled in, and avoids a per-parameter lane UI
   that would swamp the sidebar.
   ══════════════════════════════════════════════════════════════ */

const anim = {
  open:false, duration:3, fps:30, ease:'inout',
  keys:[],            // [{t, state}] sorted by t
  playing:false, t:0, cur:-1,
  size:720, rendering:false
};

/* A pose is a deep copy of the stack: which effects, on/off, and every
   parameter value. Non-numeric values (shape name, custom outline) ride
   along and snap rather than interpolate. */
function animSnapshot(){
  /* Carry the instance id: the same effect can now appear twice in the stack,
     so matching poses by type alone would blend the wrong pair. */
  return stack.map(e=>({id:e.id, type:e.type, on:e.on, baked:!!e.baked,
                        p:Object.assign({}, e.p)}));
}

const EASE = {
  linear: t=>t,
  inout:  t=> t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2,
  in:     t=> t*t,
  out:    t=> 1-(1-t)*(1-t)
};

/* Blend two poses. Numbers interpolate; anything else takes the
   nearer pose, so a shape swap flips at the midpoint instead of
   producing nonsense halfway. */
function animBlend(a, b, u){
  const out=[];
  for(const ea of a){
    const eb = b.find(x=>x.id===ea.id);
    if(!eb){ out.push(Object.assign({},ea,{p:Object.assign({},ea.p)})); continue; }
    const p={};
    for(const k in ea.p){
      const va=ea.p[k], vb=eb.p[k];
      p[k] = (typeof va==='number' && typeof vb==='number')
        ? va+(vb-va)*u
        : (u<0.5 ? va : vb);
    }
    out.push({id:ea.id, type:ea.type, baked:ea.baked, on:(u<0.5?ea.on:eb.on), p});
  }
  /* Effects that only exist in the later pose fade in at the midpoint. */
  for(const eb of b) if(!a.find(x=>x.id===eb.id) && u>=0.5)
    out.push(Object.assign({},eb,{p:Object.assign({},eb.p)}));
  return out;
}

/* Resolve the pose at time t (seconds) and push it onto the live stack. */
function animApply(t){
  const K=anim.keys;
  if(!K.length) return;
  let pose;
  if(K.length===1 || t<=K[0].t) pose=K[0].state;
  else if(t>=K[K.length-1].t) pose=K[K.length-1].state;
  else{
    let i=0; while(i<K.length-1 && K[i+1].t<t) i++;
    const A=K[i], B=K[i+1];
    const span=(B.t-A.t)||1e-6;
    const u=EASE[anim.ease]((t-A.t)/span);
    pose=animBlend(A.state, B.state, u);
  }
  stack.length=0;
  for(const e of pose) stack.push({id:e.id, type:e.type, on:e.on, baked:!!e.baked,
                                   open:false, p:Object.assign({},e.p)});
  cache.clear();
}

function animSort(){ anim.keys.sort((a,b)=>a.t-b.t); }

function animAddKey(t){
  let time = Math.max(0, Math.min(anim.duration, t===undefined?anim.t:t));
  /* The playhead starts on the first key, so a plain "+ keyframe" would
     otherwise keep overwriting it and you could never build a second pose.
     When the playhead already sits on a key, drop the new one at the end of
     the clip — or halfway to the next key if the end is taken. */
  if(t===undefined && anim.keys.some(k=>Math.abs(k.t-time)<0.02)){
    if(!anim.keys.some(k=>Math.abs(k.t-anim.duration)<0.02)) time=anim.duration;
    else{
      const next=anim.keys.find(k=>k.t>time+0.02);
      if(next) time=(time+next.t)/2;
    }
  }
  const existing = anim.keys.find(k=>Math.abs(k.t-time)<0.02);
  if(existing) existing.state=animSnapshot();
  else anim.keys.push({t:time, state:animSnapshot()});
  animSort();
  anim.t=time;
  anim.cur=anim.keys.findIndex(k=>Math.abs(k.t-time)<0.02);
  renderAnim();
}
function animDeleteKey(i){ anim.keys.splice(i,1); renderAnim(); }

function animGoto(t, opts){
  anim.t=Math.max(0,Math.min(anim.duration,t));
  animApply(anim.t);
  renderPreview();
  if(!opts||!opts.quiet){ renderAnimScrub(); renderSidebar(); }
}

/* ── Playback ───────────────────────────────────────────────── */
let animRAF=null, animT0=0;
function animPlay(){
  if(anim.playing || anim.keys.length<2) return;
  anim.playing=true;
  animT0=performance.now()-anim.t*1000;
  const step=()=>{
    if(!anim.playing) return;
    let t=(performance.now()-animT0)/1000;
    if(t>anim.duration){ t=t%anim.duration; animT0=performance.now()-t*1000; }
    anim.t=t;
    animApply(t);
    renderPreview();          // preview only — the grid is far too slow at 30fps
    renderAnimScrub();
    animRAF=requestAnimationFrame(step);
  };
  animRAF=requestAnimationFrame(step);
  renderAnimButtons();
}
function animStop(){
  anim.playing=false;
  if(animRAF) cancelAnimationFrame(animRAF);
  renderAnimButtons();
  renderSidebar();
  render();
}

/* ── Frame rendering ────────────────────────────────────────── */
/* Lay the text out and return raw contours (not path strings) so we can
   fill them straight onto a canvas. */
function layoutContours(text){
  const out=[]; let pen=0;
  const trackUnits=cfg.tracking*upm/1000;
  for(const ch of text){
    const g=font.charToGlyph(ch);
    if(ch!==' ')
      for(const c of processGlyph(g)) out.push(c.map(p=>({x:p.x+pen, y:p.y})));
    pen += (g.advanceWidth||upm*0.35) + trackUnits;
  }
  return {contours:out, width:pen};
}
function frameContours(){
  if(artwork) return processArtwork().map(c=>c.slice());
  const lines=document.getElementById('text').value.split('\n');
  const laid=lines.map(l=>layoutContours(l));
  const maxW=Math.max(1,...laid.map(l=>l.width));
  const all=[];
  laid.forEach((L,i)=>{
    let xOff=0;
    if(cfg.align==='center') xOff=(maxW-L.width)/2;
    else if(cfg.align==='right') xOff=maxW-L.width;
    const yOff=-i*upm*LINE_LH;
    for(const c of L.contours) all.push(c.map(p=>({x:p.x+xOff, y:p.y+yOff})));
  });
  return all;
}

/* Sample the whole clip once to get a bounding box that covers every
   frame. Without this the export would zoom in and out as the geometry
   grows and shrinks — the most visible possible artefact. */
function animGlobalBox(samples){
  const saved=animSnapshot(), savedT=anim.t;
  let b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  const n=Math.max(2,samples||14);
  for(let i=0;i<n;i++){
    animApply(anim.duration*i/(n-1));
    for(const c of frameContours()) for(const p of c){
      if(p.x<b.x0)b.x0=p.x; if(p.x>b.x1)b.x1=p.x;
      if(p.y<b.y0)b.y0=p.y; if(p.y>b.y1)b.y1=p.y;
    }
  }
  if(b.x0>b.x1){ b={x0:0,y0:0,x1:upm,y1:upm}; }
  stack.length=0;
  for(const e of saved) stack.push({id:e.id,type:e.type,on:e.on,baked:!!e.baked,open:false,p:Object.assign({},e.p)});
  cache.clear();
  anim.t=savedT;
  return b;
}

/* Every raster/video export goes through this: a 2D context pinned to sRGB.
   Left to itself the browser can hand back a display-P3 buffer on a wide-gamut
   Mac, and the exported colours then no longer match the hex you dialled in. */
function exportCtx(cv){
  let ctx=null;
  try{ ctx=cv.getContext('2d',{colorSpace:'srgb', willReadFrequently:true}); }catch(e){}
  return ctx || cv.getContext('2d');
}

/* `transparent` skips the background fill so the caller can key it out.
   Anything that can't carry alpha (MP4) leaves it off and gets the flat fill. */
function drawFrame(ctx, W, H, box, opts){
  const transparent = !!(opts && opts.transparent);
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if(!transparent){
    ctx.fillStyle=cfg.colorBg||'#ffffff';
    ctx.fillRect(0,0,W,H);
  }
  const pad=0.08;
  const bw=Math.max(1,box.x1-box.x0), bh=Math.max(1,box.y1-box.y0);
  const s=Math.min(W*(1-pad*2)/bw, H*(1-pad*2)/bh);
  ctx.translate(W/2, H/2);
  ctx.scale(s,-s);                                  // flip: font y is up
  ctx.translate(-(box.x0+box.x1)/2, -(box.y0+box.y1)/2);
  ctx.fillStyle=cfg.colorInk||'#000000';
  ctx.beginPath();
  for(const c of frameContours()){
    ctx.moveTo(c[0].x,c[0].y);
    for(let i=1;i<c.length;i++) ctx.lineTo(c[i].x,c[i].y);
    ctx.closePath();
  }
  ctx.fill('nonzero');
  ctx.restore();
}

const animProg = m => { const el=document.getElementById('animProg'); if(el) el.textContent=m||''; };

function loadScript(url, ms){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    /* A script tag that never fires either event would leave the export
       stuck on "Loading encoder..." forever, so time it out. */
    const timer=setTimeout(()=>rej(new Error('encoder download timed out')), ms||20000);
    s.src=url;
    s.onload=()=>{ clearTimeout(timer); res(); };
    s.onerror=()=>{ clearTimeout(timer); rej(new Error('could not load encoder (offline?)')); };
    document.head.appendChild(s);
  });
}

/* The colour space every export declares: sRGB IEC 61966-2-1. `transfer` is
   the part that actually matters — a canvas holds sRGB-encoded values, and a
   file that forgets to say so gets read back as BT.709 and shifts. */
const SRGB = {primaries:'bt709', transfer:'iec61966-2-1', matrix:'bt709', fullRange:false};

/* No background colour set means transparent, not white. */
const bgIsTransparent = () => !cfg.colorBg;

/* GIF has one-bit alpha and no alpha channel of its own: transparency is a
   colour key. Pick a key as far from the ink as possible so the quantiser
   can't confuse the two. */
function pickKey(){
  const ink=hex2rgb(cfg.colorInk||'#000000')||[0,0,0];
  const d2=c=>(c[0]-ink[0])**2+(c[1]-ink[1])**2+(c[2]-ink[2])**2;
  const cands=[[255,0,255],[0,255,0],[0,255,255],[255,255,0],[255,0,0],[0,0,255]];
  return cands.reduce((a,b)=>d2(b)>d2(a)?b:a);
}

/* Draw one frame as exactly two colours: ink where the glyph covers at least
   half a pixel, key everywhere else. Thresholding rather than letting the
   antialiased edge through is what keeps the cut-out clean — blended edge
   pixels survive quantisation and leave a coloured halo around every letter. */
function keyedFrame(ctx, W, H, box, key){
  drawFrame(ctx, W, H, box, {transparent:true});
  const img=ctx.getImageData(0,0,W,H), d=img.data;
  const ink=hex2rgb(cfg.colorInk||'#000000')||[0,0,0];
  for(let i=0;i<d.length;i+=4){
    const on = d[i+3]>=128;
    d[i]  = on?ink[0]:key[0];
    d[i+1]= on?ink[1]:key[1];
    d[i+2]= on?ink[2]:key[2];
    d[i+3]= 255;
  }
  return img;
}

/* ── GIF export ─────────────────────────────────────────────── */
async function exportGIF(){
  if(anim.rendering || anim.keys.length<2) return;
  anim.rendering=true; animStop(); renderAnimButtons();
  const saved=animSnapshot();
  let msg='';
  try{
    animProg('Loading encoder…');
    if(!window.GIF) await loadScript('/vendor/gif.js');
    if(!window.GIF) throw new Error('encoder did not load');
    /* gif.js spawns its worker from a URL. Now that the worker ships from our
       own origin the browser will take the path directly — the old fetch-and-
       wrap-in-a-blob dance only existed to get around the cross-origin refusal. */
    const workerURL='/vendor/gif.worker.js';

    const W=anim.size, H=anim.size, fps=anim.fps;
    const frames=Math.max(2,Math.round(anim.duration*fps));
    const box=animGlobalBox();
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=exportCtx(cv);

    const alpha=bgIsTransparent();
    const key=alpha?pickKey():null;
    const keyHex=alpha?rgb2hex(key):(cfg.colorBg||'#ffffff');

    const gif=new window.GIF({workers:2, quality:8, width:W, height:H,
      workerScript:workerURL, background:keyHex,
      /* gif.js takes the key as a packed 0xRRGGBB int, and forces disposal
         mode 2 (restore to background) once it's set — which is exactly what
         an animation with a cut-out background needs. */
      transparent: alpha ? ((key[0]<<16)|(key[1]<<8)|key[2]) : null});

    for(let i=0;i<frames;i++){
      animApply(anim.duration*i/frames);
      if(alpha){
        gif.addFrame(keyedFrame(ctx,W,H,box,key), {delay:Math.round(1000/fps)});
      }else{
        drawFrame(ctx,W,H,box);
        gif.addFrame(ctx, {copy:true, delay:Math.round(1000/fps)});
      }
      if(i%4===0){ animProg('Rendering '+Math.round(i/frames*100)+'%'); await new Promise(r=>setTimeout(r)); }
    }
    animProg('Encoding GIF…');
    const blob=await new Promise((res,rej)=>{
      gif.on('finished', res); gif.on('abort',()=>rej(new Error('aborted')));
      gif.render();
    });
    dl(blob, fname()+'.gif');
    msg='GIF saved ('+Math.round(blob.size/1024)+' KB'+(alpha?', transparent':'')+')';
  }catch(err){
    console.error(err);
    msg='GIF export failed: '+err.message;
  }finally{
    stack.length=0;
    for(const e of saved) stack.push({id:e.id,type:e.type,on:e.on,baked:!!e.baked,open:true,p:Object.assign({},e.p)});
    anim.rendering=false; cache.clear(); renderSidebar(); renderAnim(); render();
    animProg(msg);          // re-render wiped the panel, so restate the outcome
  }
}

/* ── MP4 export (WebCodecs) with a recorder fallback ─────────── */
function canWebCodecs(){
  return typeof window.VideoEncoder==='function' && typeof window.VideoFrame==='function';
}

/* H.264 is signalled as profile + constraint flags + level, and the level caps
   the frame size: the old avc1.42001f is Baseline @ 3.1, which tops out at
   1280x720 — so every export at the 1080 preset was refused by the encoder.
   Ask the browser what it will actually take instead of guessing. */
async function pickAvcConfig(W,H,fps){
  const cands=['avc1.640034','avc1.4d0034','avc1.420034',   // High / Main / Baseline @ 5.2
               'avc1.640028','avc1.4d0028','avc1.420028',   // ... @ 4.0
               'avc1.42001f'];                              // Baseline @ 3.1
  const base={width:W, height:H, bitrate:6_000_000, framerate:fps,
    /* mp4-muxer needs an AVCC record (the `description`), not Annex B.
       That is the spec default, but a browser that guesses the other way
       leaves the muxer with nothing to write into avcC. */
    avc:{format:'avc'}};
  if(typeof window.VideoEncoder.isConfigSupported!=='function')
    return Object.assign({codec:cands[0]}, base);
  for(const codec of cands){
    try{
      const r=await window.VideoEncoder.isConfigSupported(Object.assign({codec}, base));
      if(r && r.supported) return r.config || Object.assign({codec}, base);
    }catch(e){ /* an unknown codec string throws rather than returning false */ }
  }
  return null;
}

/* Force the sRGB transfer function onto whatever the encoder reports.
   The canvas holds sRGB-encoded values; a file that doesn't say so is read
   back as BT.709 and the midtones lift. Primaries and matrix are kept as the
   encoder actually produced them — claiming full range or identity matrix on
   a 4:2:0 stream would shift the levels for real. */
function srgbColorSpace(reported){
  const cs=Object.assign({}, SRGB);
  if(reported) for(const k of ['primaries','matrix','fullRange'])
    if(reported[k]!==null && reported[k]!==undefined) cs[k]=reported[k];
  cs.transfer='iec61966-2-1';                       // IEC 61966-2-1, i.e. sRGB
  /* mp4-muxer only maps a handful of names; anything else would write a
     garbage colr box, so clamp to something it knows. */
  if(['bt709','bt470bg','smpte170m'].indexOf(cs.primaries)<0) cs.primaries='bt709';
  if(['rgb','bt709','bt470bg','smpte170m'].indexOf(cs.matrix)<0) cs.matrix='bt709';
  return cs;
}

async function encodeMP4(cv, ctx, W, H, box, frames, fps){
  animProg('Loading muxer…');
  if(!window.Mp4Muxer) await loadScript('/vendor/mp4-muxer.js');
  if(!window.Mp4Muxer) throw new Error('muxer did not load');

  const config=await pickAvcConfig(W,H,fps);
  if(!config) throw new Error('no H.264 encoder for '+W+'\u00d7'+H);

  const muxer=new window.Mp4Muxer.Muxer({
    target:new window.Mp4Muxer.ArrayBufferTarget(),
    video:{codec:'avc', width:W, height:H, frameRate:fps},
    fastStart:'in-memory'
  });

  /* The old code logged encoder errors and carried on, so a refused config
     still finalised a container with an empty track: a .mp4 that downloads
     and then won't open anywhere. Errors now stop the export. */
  let encErr=null, chunks=0;
  const encoder=new window.VideoEncoder({
    output:(chunk,meta)=>{
      let m=meta;
      if(m && m.decoderConfig){
        m=Object.assign({}, m, {decoderConfig:Object.assign({}, m.decoderConfig,
          {colorSpace:srgbColorSpace(m.decoderConfig.colorSpace)})});
      }
      chunks++;
      try{ muxer.addVideoChunk(chunk, m); }catch(e){ encErr=encErr||e; }
    },
    error:e=>{ encErr=encErr||e; }
  });
  encoder.configure(config);

  const bail=()=>{ if(encErr) throw (encErr instanceof Error?encErr:new Error(String(encErr))); };

  try{
    for(let i=0;i<frames;i++){
      bail();
      animApply(anim.duration*i/frames);
      drawFrame(ctx,W,H,box);                       // H.264 has no alpha: flat fill
      const vf=new window.VideoFrame(cv,{timestamp:Math.round(i*1e6/fps), duration:Math.round(1e6/fps)});
      try{ encoder.encode(vf,{keyFrame:i%Math.round(fps)===0}); }
      finally{ vf.close(); }
      if(i%4===0){ animProg('Rendering '+Math.round(i/frames*100)+'%'); await new Promise(r=>setTimeout(r)); }
      /* Don't let the encoder queue run away on long clips. */
      while(encoder.encodeQueueSize>12 && !encErr) await new Promise(r=>setTimeout(r));
    }
    bail();
    animProg('Encoding MP4…');
    await encoder.flush();
    bail();
  }finally{
    if(encoder.state!=='closed') try{ encoder.close(); }catch(e){}
  }

  if(!chunks) throw new Error('encoder returned no frames');
  muxer.finalize();
  const buf=muxer.target.buffer;
  if(!buf || !buf.byteLength) throw new Error('muxer produced an empty file');
  return {blob:new Blob([buf],{type:'video/mp4'}), ext:'mp4'};
}

async function exportMP4(){
  if(anim.rendering || anim.keys.length<2) return;
  anim.rendering=true; animStop(); renderAnimButtons();
  const saved=animSnapshot();
  let msg='';
  try{
    const W=anim.size, H=anim.size, fps=anim.fps;
    const frames=Math.max(2,Math.round(anim.duration*fps));
    const box=animGlobalBox();
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=exportCtx(cv);

    let out=null, why='';
    if(canWebCodecs()){
      try{ out=await encodeMP4(cv,ctx,W,H,box,frames,fps); }
      catch(err){ console.error(err); why=err.message||String(err); }
    }else{
      why='no WebCodecs in this browser';
    }

    /* Last resort: record the canvas in real time. Safari will hand back an
       MP4 here; everything else gives WebM. */
    if(!out){
      animProg('Falling back to a recording…');
      out=await recordCanvas(cv,ctx,W,H,box,frames,fps);
      out.fallback=true;
    }

    dl(out.blob, fname()+'.'+out.ext);
    msg=out.ext.toUpperCase()+' saved ('+Math.round(out.blob.size/1024)+' KB)'
      + (out.fallback&&why ? ' \u2014 '+why : '');
  }catch(err){
    console.error(err);
    msg='MP4 export failed: '+(err.message||err);
  }finally{
    stack.length=0;
    for(const e of saved) stack.push({id:e.id,type:e.type,on:e.on,baked:!!e.baked,open:true,p:Object.assign({},e.p)});
    anim.rendering=false; cache.clear(); renderSidebar(); renderAnim(); render();
    animProg(msg);          // re-render wiped the panel, so restate the outcome
  }
}

/* Fallback for browsers without WebCodecs, or when the encoder refuses the
   config: MediaRecorder on a canvas stream. Real-time only. */
function recordCanvas(cv,ctx,W,H,box,frames,fps){
  return new Promise((res,rej)=>{
    if(!window.MediaRecorder || !cv.captureStream){ rej(new Error('no recorder support')); return; }
    const stream=cv.captureStream(fps);
    const types=['video/mp4;codecs=avc1.640034','video/mp4;codecs=avc1','video/mp4',
                 'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    const type=types.find(t=>MediaRecorder.isTypeSupported(t));
    if(!type){ rej(new Error('no recorder support')); return; }
    const ext=type.indexOf('mp4')>=0 ? 'mp4' : 'webm';
    const rec=new MediaRecorder(stream,{mimeType:type, videoBitsPerSecond:6_000_000});
    const parts=[];
    rec.ondataavailable=e=>{ if(e.data.size) parts.push(e.data); };
    rec.onerror=e=>rej(e.error||new Error('recorder failed'));
    rec.onstop=()=>{
      const blob=new Blob(parts,{type});
      if(!blob.size) rej(new Error('recorder produced nothing'));
      else res({blob, ext});
    };
    rec.start();
    let i=0;
    const tick=()=>{
      if(i>=frames){ setTimeout(()=>rec.stop(), 1000/fps); return; }
      animApply(anim.duration*i/frames);
      drawFrame(ctx,W,H,box);
      animProg('Recording '+Math.round(i/frames*100)+'%');
      i++;
      setTimeout(tick, 1000/fps);
    };
    tick();
  });
}

/* ── Timeline UI ─────────────────────────────────────────────
   A horizontal track under the text box, After Effects style: a ruler,
   a lane of keyframe diamonds you can drag to retime, and a playhead you
   can scrub. Transport and export controls sit in the bar above it.
   ─────────────────────────────────────────────────────────── */

const TL = {drag:null};        // {mode:'scrub'|'key', index}

function tlTimeToPct(t){ return Math.max(0,Math.min(1, t/anim.duration))*100; }

function tlRulerTicks(){
  /* Aim for roughly one label every 90px; fall back on a sane step. */
  const track=document.getElementById('tlInner') || document.getElementById('tlTrack');
  const w=track ? track.getBoundingClientRect().width : 600;
  const want=Math.max(2, Math.round(w/90));
  const raw=anim.duration/want;
  const steps=[0.1,0.25,0.5,1,2,5,10];
  const step=steps.find(s=>s>=raw) || Math.ceil(raw);
  let out='';
  for(let t=0;t<=anim.duration+1e-6;t+=step){
    const pct=tlTimeToPct(t);
    /* The final label would hang off the right edge, so flip it inward. */
    const last = pct>99.5;
    out+=`<div class="tl-tick${last?' last':''}" style="left:${pct}%"><span>${
      (Math.round(t*100)/100)}s</span></div>`;
  }
  return out;
}

function renderAnim(){
  const el=document.getElementById('timeline');
  if(!el) return;
  el.classList.toggle('open', anim.open);
  const btn=document.getElementById('montageBtn');
  if(btn){
    btn.classList.toggle('open', anim.open);

  }
  if(!anim.open){ el.innerHTML=''; return; }

  const keys=anim.keys.map((k,i)=>
    `<div class="tl-key ${i===anim.cur?'sel':''}" data-tl-key="${i}"
          style="left:${tlTimeToPct(k.t)}%" title="${k.t.toFixed(2)}s \u2014 drag to retime"></div>`
  ).join('');
  const noKeys=anim.keys.length<2;

  el.innerHTML=`
    <div class="tl-top">
      <span class="tl-title">montage</span>
      <span class="tl-time">${anim.t.toFixed(2)} / ${(+anim.duration).toFixed(2)}s</span>
      <span class="tl-spacer"></span>
      <button class="tl-x" data-anim-act="close" title="Close">\u2715</button>
    </div>

    <div class="tl-bar">
      <div class="tl-transport">
        <button class="tl-btn primary" data-anim-act="play" ${noKeys?'disabled':''}
          title="Play / stop (space)">${anim.playing?'\u25a0':'\u25b6'}</button>
        <button class="tl-btn" data-anim-act="add"
          title="Add a keyframe at the playhead">\u25c6&nbsp;+</button>
        <button class="tl-btn" data-anim-act="del" ${anim.cur<0?'disabled':''}
          title="Delete selected keyframe (del)">\u25c6&nbsp;\u2212</button>
      </div>
      <span class="tl-spacer"></span>
      <div class="tl-fields">
        <span class="tl-field"><span class="k">length</span>
          <span class="numspin">
            <input type="number" min="0.2" max="30" step="0.5" value="${anim.duration}" data-anim="duration">
            <span class="spin"><button data-anim-nudge="duration" data-dir="0.5">\u25b2</button>
            <button data-anim-nudge="duration" data-dir="-0.5">\u25bc</button></span>
            <span class="unit">s</span>
          </span></span>
        <span class="tl-field"><span class="k">fps</span>
          <select data-anim="fps">${[12,15,24,30,60].map(v=>
            `<option value="${v}" ${v===anim.fps?'selected':''}>${v}</option>`).join('')}</select></span>
        <span class="tl-field"><span class="k">ease</span>
          <select data-anim="ease">${[['inout','in-out'],['linear','linear'],['in','in'],['out','out']]
            .map(([v,l])=>`<option value="${v}" ${v===anim.ease?'selected':''}>${l}</option>`).join('')}</select></span>
        <span class="tl-field"><span class="k">size</span>
          <select data-anim="size">${[360,540,720,1080].map(v=>
            `<option value="${v}" ${v===anim.size?'selected':''}>${v}px</option>`).join('')}</select></span>
      </div>
    </div>

    <div class="tl-track" id="tlTrack">
      <div class="tl-inner" id="tlInner">
        <div class="tl-ruler">${tlRulerTicks()}</div>
        <div class="tl-lane">
          <div class="tl-guide"></div>
          ${anim.keys.length>1?`<div class="tl-span" style="left:${
            tlTimeToPct(anim.keys[0].t)}%;right:${100-tlTimeToPct(anim.keys[anim.keys.length-1].t)}%"></div>`:''}
          ${keys}
        </div>
        <div class="tl-head" id="tlHead" style="left:${tlTimeToPct(anim.t)}%"></div>
      </div>
    </div>

    <div class="tl-foot">
      <span class="tl-prog" id="animProg"></span>
      <span class="tl-spacer"></span>
      <button class="tl-btn" data-anim-act="gif" ${noKeys||anim.rendering?'disabled':''}>export gif</button>
      <button class="tl-btn" data-anim-act="mp4" ${noKeys||anim.rendering?'disabled':''}>export mp4</button>
    </div>
    ${anim.keys.length?'':'<p class="tl-hint">Set up a look, then hit \u25c6 + to drop your first keyframe. Change the effects and add another to animate between them.</p>'}`;
}

function renderAnimScrub(){
  const head=document.getElementById('tlHead');
  if(head) head.style.left=tlTimeToPct(anim.t)+'%';
  const t=document.querySelector('.tl-time');
  if(t) t.textContent=anim.t.toFixed(2)+' / '+(+anim.duration).toFixed(2)+'s';
}
function renderAnimButtons(){
  const b=document.querySelector('[data-anim-act="play"]');
  if(b){ b.textContent=anim.playing?'\u25a0':'\u25b6'; b.disabled=anim.keys.length<2; }
  for(const act of ['gif','mp4']){
    const x=document.querySelector(`[data-anim-act="${act}"]`);
    if(x) x.disabled = anim.keys.length<2 || anim.rendering;
  }
  const dl=document.querySelector('[data-anim-act="del"]');
  if(dl) dl.disabled = anim.cur<0;
}

/* Pointer x -> time on the track. */
function tlTimeAt(clientX){
  /* Measure the inset area: the track is padded so keyframes sitting on 0s
     or on the last frame aren't sliced by the border. */
  const tr=document.getElementById('tlInner');
  if(!tr) return 0;
  const r=tr.getBoundingClientRect();
  return Math.max(0, Math.min(1, (clientX-r.left)/Math.max(1,r.width))) * anim.duration;
}

document.getElementById('montageBtn').onclick=()=>{
  anim.open=!anim.open;
  /* Opening on an empty timeline with a look already dialled in: seed the
     first keyframe so there is something to animate from. */
  if(anim.open && !anim.keys.length && stack.length) animAddKey(0);
  else renderAnim();
  if(!anim.open && anim.playing) animStop();
  render();
};

const timelineEl=document.getElementById('timeline');

timelineEl.addEventListener('pointerdown', ev=>{
  const keyEl=ev.target.closest('[data-tl-key]');
  const track=ev.target.closest('#tlTrack');
  if(!keyEl && !track) return;
  ev.preventDefault();
  if(anim.playing) animStop();

  if(keyEl){
    /* Grab a keyframe: select it, jump there, and allow dragging to retime. */
    const i=+keyEl.dataset.tlKey;
    anim.cur=i;
    const key=anim.keys[i];
    animGoto(key.t);
    TL.drag={mode:'key', key};
  }else{
    TL.drag={mode:'scrub'};
    animGoto(tlTimeAt(ev.clientX), {quiet:true});
    renderAnimScrub(); renderSidebar();
  }
  timelineEl.setPointerCapture(ev.pointerId);
});

timelineEl.addEventListener('pointermove', ev=>{
  if(!TL.drag) return;
  const t=tlTimeAt(ev.clientX);
  if(TL.drag.mode==='scrub'){
    animGoto(t, {quiet:true});
    renderAnimScrub(); renderSidebar();
  }else{
    /* Retiming: move the key, keep the list sorted, follow it with the
       playhead so you can see what you're dragging. Two keys landing on the
       same instant would make a zero-length segment, so keep them apart. */
    let nt=Math.max(0, Math.min(anim.duration, t));
    const MIN=0.03;
    for(const k of anim.keys){
      if(k===TL.drag.key) continue;
      if(Math.abs(k.t-nt)<MIN) nt = nt>=k.t ? k.t+MIN : k.t-MIN;
    }
    TL.drag.key.t=Math.max(0, Math.min(anim.duration, nt));
    animSort();
    anim.cur=anim.keys.indexOf(TL.drag.key);
    anim.t=TL.drag.key.t;
    animApply(anim.t); renderPreview();
    renderAnim();
  }
});

const tlEndDrag=ev=>{
  if(!TL.drag) return;
  TL.drag=null;
  try{ timelineEl.releasePointerCapture(ev.pointerId); }catch(e){}
  renderAnim(); renderSidebar(); render();
};
timelineEl.addEventListener('pointerup', tlEndDrag);
timelineEl.addEventListener('pointercancel', tlEndDrag);

timelineEl.addEventListener('click', ev=>{
  let m;
  if((m=ev.target.closest('[data-anim-nudge]'))){
    anim.duration=Math.max(0.2,Math.min(30, anim.duration+(+m.dataset.dir)));
    for(const k of anim.keys) k.t=Math.min(k.t, anim.duration);
    renderAnim(); return;
  }
  if((m=ev.target.closest('[data-anim-act]'))){
    const a=m.dataset.animAct;
    if(a==='close'){ if(anim.playing) animStop(); anim.open=false; renderAnim(); render(); return; }
    if(a==='add') animAddKey();
    else if(a==='del'){ if(anim.cur>=0){ animDeleteKey(anim.cur); anim.cur=-1; renderAnim(); } }
    else if(a==='play') anim.playing?animStop():animPlay();
    else if(a==='gif') exportGIF();
    else if(a==='mp4') exportMP4();
    return;
  }
});

timelineEl.addEventListener('input', ev=>{
  const key=ev.target.dataset.anim;
  if(!key) return;
  if(key==='duration'){
    anim.duration=Math.max(0.2,Math.min(30,+ev.target.value||3));
    for(const k of anim.keys) k.t=Math.min(k.t, anim.duration);
    renderAnim();
  }
  else if(key==='fps')  anim.fps=+ev.target.value;
  else if(key==='size') anim.size=+ev.target.value;
  else if(key==='ease') anim.ease=ev.target.value;
});

/* Delete removes the selected keyframe — but never while typing. */
document.addEventListener('keydown', ev=>{
  if(ev.key!=='Delete' && ev.key!=='Backspace') return;
  const a=document.activeElement;
  if(a && (a.tagName==='TEXTAREA' || a.tagName==='INPUT' || a.tagName==='SELECT')) return;
  if(!anim.open || anim.cur<0 || anim.cur>=anim.keys.length) return;
  ev.preventDefault();
  animDeleteKey(anim.cur); anim.cur=-1; renderAnim();
});
/* Space toggles playback, again only outside a field. */
document.addEventListener('keydown', ev=>{
  if(ev.code!=='Space') return;
  const a=document.activeElement;
  if(a && (a.tagName==='TEXTAREA' || a.tagName==='INPUT' || a.tagName==='SELECT')) return;
  if(!anim.open || anim.keys.length<2) return;
  ev.preventDefault();
  anim.playing?animStop():animPlay();
});

window.addEventListener('resize', ()=>{ if(anim.keys.length||true) renderAnim(); });

function renderSidebar(){
  renderPicker();
  renderStack();
  const btn=document.getElementById('effectsBtn');
  btn.classList.toggle('open', pickerOpen);

}

function renderPicker(){
  const p = document.getElementById('picker');
  p.classList.toggle('open', pickerOpen);
  if(!pickerOpen){ p.innerHTML=''; return; }
  p.innerHTML = EFFECTS_ORDER.map(type=>
    `<button class="picker-item" data-add="${type}">${esc(REGISTRY[type].label)}</button>`
  ).join('');
}

function renderStack(){
  const root = document.getElementById('stack');
  root.innerHTML = stack.map(renderCard).join('');
  for(const inst of stack) if(REGISTRY[inst.type].warp && !inst.baked) hookWarp(inst);

  /* A new card lands at the foot of a list that may already be scrolled out of
     sight, so adding an effect could look like nothing happened. Mark it and
     bring it into view. The flag is consumed here, so the cue fires once on
     add and not on every later redraw of the stack. */
  if(freshId !== null){
    const card = root.querySelector(`[data-card="${freshId}"]`);
    freshId = null;
    if(card){
      /* Guarded: if matchMedia is missing this must not throw, or adding an
         effect would half-fail after the card is already in the DOM. */
      const still = !!(window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion:reduce)').matches);
      requestAnimationFrame(()=>card.scrollIntoView(
        {block:'nearest', behavior: still ? 'auto' : 'smooth'}));
    }
  }
}

function renderCard(inst){
  const d = REGISTRY[inst.type];

  if(inst.baked){
    /* Frozen into the outlines. The card stays put so the recipe is still
       readable, and the newest bake can be undone from here. */
    /* One undo per bake, not one per frozen card: offer it on the last card
       of the newest group, since undoing releases the whole group at once. */
    const grp = bakes[inst.bakeIndex-1];
    const newest = inst.bakeIndex === bakes.length &&
                   grp && grp.ids[grp.ids.length-1] === inst.id;
    return `<div class="card baked ${inst.open?'open':''}" data-card="${inst.id}">
      <div class="card-head">
        <span class="title">${esc(d.label)}</span>
        <span class="lockmark" title="Baked into the outlines">${ICON_LOCK}</span>
        <button class="icobtn" data-collapse="${inst.id}"
          title="${inst.open?'Collapse':'Expand'}">${inst.open?ICON_CHEV_UP:ICON_CHEV_DOWN}</button>
      </div>
      <div class="card-body">
        <p class="baked-note">Baked in when a second ${esc(inst.bakeReason||d.label)} was
          added, so these settings can't be changed any more.</p>
        ${newest
          ? `<button class="undo-btn" data-unbake="1">Undo bake &mdash; make editable again</button>`
          : (inst.bakeIndex === bakes.length
              ? ''
              : `<p class="baked-note dim">Undo the later bake first to reach this one.</p>`)}
        <div class="frozen">${renderControls(inst)}</div>
      </div>
    </div>`;
  }

  // ON  → chevron (collapse / expand the parameters)
  // OFF → trash    (remove the effect entirely)
  const rightIcon = inst.on
    ? `<button class="icobtn" data-collapse="${inst.id}" title="${inst.open?'Collapse':'Expand'}">${inst.open?ICON_CHEV_UP:ICON_CHEV_DOWN}</button>`
    : `<button class="icobtn" data-remove="${inst.id}" title="Remove">${ICON_TRASH}</button>`;
  return `<div class="card ${inst.open?'open':''}" data-card="${inst.id}">
    <div class="card-head ${inst.on?'':'off'}">
      <span class="title">${esc(d.label)}</span>
      <span class="sw ${inst.on?'on':''}" data-toggle="${inst.id}"></span>
      ${rightIcon}
    </div>
    <div class="card-body">${renderControls(inst)}</div>
  </div>`;
}

function renderControls(inst){
  if(!inst) return '';
  const d = REGISTRY[inst.type], type = inst.id;
  let h='';
  for(const c of d.controls){
    if(c.type==='file'){
      const nm=inst.p.customName;
      h+=`<label class="filebtn" data-file="${type}">${nm?'↻ '+esc(nm):esc(c.label)}</label>
          <input type="file" accept=".svg,image/*" data-fileinput="${type}" hidden>`;
    }
    else if(c.type==='warp'){
      h+=renderWarp(inst.id);
    }
    else if(c.type==='numinput'){
      h+=`<div class="opt numinput-row">
        <span class="lbl">${c.label}</span>
        <div class="numspin">
          <input type="number" min="${c.min}" max="${c.max}" step="${c.step}" value="${inst.p[c.key]}"
                 data-num="${type}" data-key="${c.key}">
          <div class="spin">
            <button data-numnudge="${type}" data-key="${c.key}" data-dir="1">▲</button>
            <button data-numnudge="${type}" data-key="${c.key}" data-dir="-1">▼</button>
          </div>
          <span class="unit">${(c.unit||'').trim()}</span>
        </div>
      </div>`;
    }
    else if(c.type==='seg'){
      h+=`<div class="opt"><div class="opt-label">${c.label}</div><div class="seg">`+
        c.opts.map(([v,l])=>`<button data-seg="${type}" data-key="${c.key}" data-val="${v}" class="${inst.p[c.key]===v?'on':''}">${l}</button>`).join('')+
        `</div></div>`;
    }
    else {
      const v=inst.p[c.key];
      h+=`<div class="opt"><label>${c.label}<span data-val-of="${type}:${c.key}">${fmt(v,c.step)}${c.unit||''}</span></label>
          <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}"
                 data-range="${type}" data-key="${c.key}" data-unit="${c.unit||''}"></div>`;
    }
  }
  return h;
}

/* ── Distort widget: drag the 4 corners to warp the pixel shape ── */
const WARP_HALF = 42;   // half-size of the unit square in widget viewBox units
/* Wide enough that the rotate handle, which sits on a stem outside the box,
   is not clipped by the edge of the widget. */
const WARP_VB   = 132;


function renderWarp(type){
  let dots='';
  const N=7, span=40;
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const x=-span+i*(span*2/(N-1)), y=-span+j*(span*2/(N-1));
    dots+=`<circle class="grid-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="0.9"/>`;
  }
  let handles='';
  for(const c of WARP_KEYS){
    /* Corners are square (free distort), sides are round (axis scale) —
       the shape tells you what the handle will do. */
    const side = WARP_SIDES.includes(c);
    handles+=`<rect class="warp-handle ${side?'edge':'corner'}" data-warp-corner="${c}"`+
             ` x="0" y="0" width="9" height="9" rx="${side?4.5:1.5}"/>`;
  }
  return `<div class="warp" data-warp-widget="${type}">
    <div class="warp-head">
      <span class="warp-title">distort</span>
      <span class="warp-readout" data-warp-readout="${type}"></span>
      <button class="warp-reset" data-warp-reset="${type}" title="Reset">${ICON_RESET}</button>
    </div>
    <svg class="warp-svg" viewBox="${-WARP_VB/2} ${-WARP_VB/2} ${WARP_VB} ${WARP_VB}">${dots}
      <path class="warp-edge" d=""/>
      <path class="warp-shape" d=""/>
      <line class="warp-rot-stem" x1="0" y1="0" x2="0" y2="0"/>
      ${handles}
      <circle class="warp-handle rot" data-warp-corner="rot" cx="0" cy="0" r="5"/>
    </svg>
    <p class="warp-hint">sides scale · corners distort · alt = from centre</p>
  </div>`;
}

/* The letter shown inside the pixel distort box when warpProxy is set.
   Falls back to a plain square when nothing is loaded yet. */
let _proxyShape=null, _proxyKey='';
function warpProxyShape(){
  const key = artwork ? 'svg:'+artwork.name : (ready ? 'font:'+upm+':'+(font.numGlyphs||0) : '');
  if(key && key===_proxyKey && _proxyShape) return _proxyShape;
  let cs=null;
  try{
    if(artwork) cs=artwork.contours;
    else if(ready) cs=flatten(font.charToGlyph('A').path.commands, upm/60);
  }catch(e){}
  _proxyKey=key;
  _proxyShape = (cs && cs.length) ? normalize(cs) : [SHAPES.square];
  return _proxyShape;
}

/* Convert a pointer event into shape-space coordinates (y up, unit box). */
function warpPointer(ev, svg){
  const r = svg.getBoundingClientRect();
  const S = WARP_HALF*2;
  const vx = ((ev.clientX-r.left)/r.width  - 0.5)*WARP_VB;
  const vy = ((ev.clientY-r.top) /r.height - 0.5)*WARP_VB;
  return {x: vx/S, y: -vy/S};        // SVG y is down, shape y is up
}

function updateWarpVisual(inst){
  const el = document.querySelector(`.warp[data-warp-widget="${inst.id}"]`);
  if(!el) return;
  const svg = el.querySelector('svg.warp-svg');   // NOT just 'svg': the reset
  if(!svg) return;                                // button holds an icon svg too
  /* When warpProxy is set, the widget previews a letter — the actual
     'A' of the loaded font, or the SVG source when there is one. */
  const shapes = REGISTRY[inst.type].warpProxy ? warpProxyShape()
    : (inst.p.shape==='custom' && inst.p.custom
        ? inst.p.custom : [SHAPES[inst.p.shape]||SHAPES.square]);
  const w = warpOf(inst.p);
  const S = WARP_HALF*2;
  const toSvg = p => `${(p.x*S).toFixed(1)} ${(-p.y*S).toFixed(1)}`;

  let d='';
  for(const sh of shapes) d += 'M'+warpShape(sh, w).map(toSvg).join('L')+'Z';
  svg.querySelector('.warp-shape').setAttribute('d', d);

  /* Dashed outline of the transform box — shows what the handles are doing
     even when the pixel shape inside is small. */
  const cell = warpShape([{x:-.5,y:-.5},{x:.5,y:-.5},{x:.5,y:.5},{x:-.5,y:.5}], w);
  svg.querySelector('.warp-edge').setAttribute('d','M'+cell.map(toSvg).join('L')+'Z');

  const pts = warpHandlePoints(w);
  for(const c of WARP_KEYS){
    const p = pts[c];
    const h = svg.querySelector(`[data-warp-corner="${c}"]`);
    h.setAttribute('x', (p.x*S-4.5).toFixed(2));
    h.setAttribute('y', (-p.y*S-4.5).toFixed(2));
  }
  /* Rotate handle: sits outside the top edge, on a short stem, and turns
     with the box — the usual place to grab a rotation. */
  const th=w.rot*Math.PI/180;
  const up={x:-Math.sin(th), y:Math.cos(th)};
  const top=pts.tm;
  const rp={x: top.x + up.x*0.17, y: top.y + up.y*0.17};
  const rot=svg.querySelector('[data-warp-corner="rot"]');
  rot.setAttribute('cx',(rp.x*S).toFixed(2));
  rot.setAttribute('cy',(-rp.y*S).toFixed(2));
  const stem=svg.querySelector('.warp-rot-stem');
  stem.setAttribute('x1',(top.x*S).toFixed(2)); stem.setAttribute('y1',(-top.y*S).toFixed(2));
  stem.setAttribute('x2',(rp.x*S).toFixed(2));  stem.setAttribute('y2',(-rp.y*S).toFixed(2));

  const out=el.querySelector('[data-warp-readout]');
  if(out){
    const parts=[];
    if(w.sx!==1||w.sy!==1) parts.push(Math.round(w.sx*100)+'% × '+Math.round(w.sy*100)+'%');
    if(w.rot) parts.push(Math.round(w.rot)+'°');
    out.textContent=parts.join('  ');
  }
}

function hookWarp(inst){
  const el = document.querySelector(`.warp[data-warp-widget="${inst.id}"]`);
  if(!el) return;
  updateWarpVisual(inst);
  const svg = el.querySelector('svg.warp-svg');
  if(!svg) return;
  const CLAMP=(v,a,b)=>Math.max(a,Math.min(b,v));

  svg.querySelectorAll('.warp-handle').forEach(h=>{
    h.addEventListener('pointerdown', ev=>{
      ev.preventDefault(); ev.stopPropagation();
      try{ h.setPointerCapture(ev.pointerId); }catch(e){}
      h.classList.add('dragging');
      const which = h.dataset.warpCorner;

      const move = mv=>{
        const P = warpPointer(mv, svg);
        const w = warpOf(inst.p);
        const alt = mv.altKey;

        if(which==='rot'){
          /* Angle from the box centre; the handle starts pointing up, so
             subtract 90°. Shift snaps to 15°, as most editors do. */
          let a = Math.atan2(P.y-w.ty, P.x-w.tx)*180/Math.PI - 90;
          if(mv.shiftKey) a = Math.round(a/15)*15;
          while(a<0) a+=360; while(a>=360) a-=360;
          inst.p.warpROT = a;
        }
        else if(WARP_SIDES.includes(which)){
          /* Illustrator bounding-box behaviour: scale along ONE axis, with
             the OPPOSITE side held still. Alt scales about the centre.
             Both handles of that axis move, because the whole shape scales —
             they are two ends of one control, not two free points. */
          const u = warpUnproject(P, w);
          if(which==='lm' || which==='rm'){
            const edge = u.ux;                       // where the dragged side lands
            if(alt){
              const s = Math.abs(edge - w.tx)/0.5;
              inst.p.warpSX = CLAMP(s, 0.05, 3);
            } else {
              const anchor = (which==='rm' ? -0.5 : 0.5)*w.sx + w.tx;   // opposite side
              const s = (which==='rm' ? edge-anchor : anchor-edge);
              inst.p.warpSX = CLAMP(s, 0.05, 3);
              inst.p.warpTX = (edge+anchor)/2;
            }
          } else {
            const edge = u.uy;
            if(alt){
              const s = Math.abs(edge - w.ty)/0.5;
              inst.p.warpSY = CLAMP(s, 0.05, 3);
            } else {
              const anchor = (which==='tm' ? -0.5 : 0.5)*w.sy + w.ty;
              const s = (which==='tm' ? edge-anchor : anchor-edge);
              inst.p.warpSY = CLAMP(s, 0.05, 3);
              inst.p.warpTY = (edge+anchor)/2;
            }
          }
        }
        else {
          /* Corners stay free: each one moves on its own so you can distort
             the cell into any quad. Undo the scale/rotation first so the
             corner follows the cursor even on a transformed box. */
          const u = warpUnproject(P, w);
          const def = {tl:[-0.5,0.5], tr:[0.5,0.5], br:[0.5,-0.5], bl:[-0.5,-0.5]}[which];
          const K = which.toUpperCase();
          inst.p['warp'+K+'x'] = CLAMP(u.x-def[0], -1.2, 1.2);
          inst.p['warp'+K+'y'] = CLAMP(u.y-def[1], -1.2, 1.2);
        }
        updateWarpVisual(inst);
        invalidate();
      };
      const up = ()=>{
        h.classList.remove('dragging');
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        h.removeEventListener('pointercancel', up);
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
      h.addEventListener('pointercancel', up);
    });
  });
}

function resetWarp(id){
  const inst = byId(id); if(!inst || inst.baked) return;
  for(const k of WARP_CORNERS){ const K=k.toUpperCase();
    inst.p['warp'+K+'x']=0; inst.p['warp'+K+'y']=0; }
  inst.p.warpSX=1; inst.p.warpSY=1; inst.p.warpTX=0; inst.p.warpTY=0; inst.p.warpROT=0;
  updateWarpVisual(inst); invalidate();
}

const stackEl = document.getElementById('stack');
stackEl.addEventListener('click', ev=>{
  const t=ev.target; let m;
  if((m=t.closest('[data-unbake]')))     { unbake(); return; }
  if((m=t.closest('[data-warp-reset]'))) { resetWarp(+m.dataset.warpReset); return; }
  if((m=t.closest('[data-numnudge]')))   {
    const e=byId(+m.dataset.numnudge); if(!e || e.baked) return;
    const ctl=REGISTRY[e.type].controls.find(c=>c.key===m.dataset.key);
    const v=Math.max(ctl.min, Math.min(ctl.max, (+e.p[m.dataset.key]||0)+(+m.dataset.dir)*ctl.step));
    e.p[m.dataset.key]=v;
    const inp=stackEl.querySelector(`[data-num="${e.id}"][data-key="${m.dataset.key}"]`);
    if(inp) inp.value=v;
    invalidate(); return;
  }
  if((m=t.closest('[data-toggle]')))   { toggleEffect(+m.dataset.toggle); return; }
  if((m=t.closest('[data-collapse]'))) { toggleEffectOpen(+m.dataset.collapse); return; }
  if((m=t.closest('[data-remove]')))   { removeEffect(+m.dataset.remove); return; }
  if((m=t.closest('[data-seg]')))      {
    const e=byId(+m.dataset.seg); if(!e || e.baked) return;
    e.p[m.dataset.key]=m.dataset.val;
    /* Repaint just this group. A full renderSidebar() here would rebuild every
       card in the chain, replaying each open card's reveal animation — so
       picking an option made the whole panel jump. No seg option changes which
       controls exist, only which one is lit, so the DOM can stay put. */
    m.parentElement.querySelectorAll('[data-seg]').forEach(b=>
      b.classList.toggle('on', b.dataset.val===m.dataset.val));
    /* The distort preview draws the current shape, so it does need a nudge. */
    if(REGISTRY[e.type].warp) updateWarpVisual(e);
    invalidate(); return;
  }
  if((m=t.closest('[data-file]')))     {
    stackEl.querySelector(`[data-fileinput="${m.dataset.file}"]`).click(); return;
  }
});

/* Control bar */
/* ── Colour picker ────────────────────────────────────────────
   Sliders rather than a colour wheel: this is a two-colour tool, and a
   channel you can read and type is more useful than a gamut you have to
   aim at. RGB or CMYK, with the hex spelled out underneath. */
const cpick = {open:false, which:null, mode:'rgb'};

const hex2rgb = s => {
  const m=/^#?([0-9a-f]{6})$/i.exec((s||'').trim());
  if(!m) return null;
  const n=parseInt(m[1],16);
  return [n>>16 & 255, n>>8 & 255, n & 255];
};
const rgb2hex = r => '#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v)))
  .toString(16).padStart(2,'0')).join('');
function rgb2cmyk([r,g,b]){
  const R=r/255, G=g/255, B=b/255;
  const k=1-Math.max(R,G,B);
  if(k>=1) return [0,0,0,100];
  return [ (1-R-k)/(1-k)*100, (1-G-k)/(1-k)*100, (1-B-k)/(1-k)*100, k*100 ];
}
function cmyk2rgb([c,m,y,k]){
  const C=c/100, M=m/100, Y=y/100, K=k/100;
  return [255*(1-C)*(1-K), 255*(1-M)*(1-K), 255*(1-Y)*(1-K)];
}
const cpickValue = () => (cpick.which==='ink'
  ? (cfg.colorInk || '#000000')
  : (cfg.colorBg  || '#ffffff'));

/* Commit a colour.

   The popover is NEVER rebuilt from here. Re-running renderCpick() on every
   'input' event tore out the very range input under the cursor: the element
   was detached mid-drag, pointer capture went with it, and the slider sprang
   back to its old value — which is why no colour ever reached the artwork.
   So the readouts are patched in place, and the full rebuild is reserved for
   opening the popover and switching RVB/CMJN.

   `origin` names the control the value came from, and that control is the one
   thing left untouched — you don't rewrite the field someone is typing in. */
function cpickSet(hex, origin){
  if(cpick.which==='ink'){
    cfg.colorInk=hex;
    document.getElementById('text').style.caretColor=hex;
  } else {
    cfg.colorBg=hex;
  }
  syncSwatches();
  cpickSyncFields(origin);
  render();
}

/* Both chips in the control bar, from the resolved colours. */
function syncSwatches(){
  const ink=document.getElementById('swInk');
  const bg =document.getElementById('swBg');
  if(ink) ink.style.background = cfg.colorInk || themeInk();
  if(bg){
    bg.style.background = cfg.colorBg || '';
    bg.classList.toggle('checker', !cfg.colorBg);
  }
}

/* Patch the open popover's readouts to match cfg, leaving `origin` alone. */
function cpickSyncFields(origin){
  const el=document.getElementById('cpick');
  if(!el || !cpick.open) return;
  const hex=cpickValue(), rgb=hex2rgb(hex)||[0,0,0];
  const prev=el.querySelector('.cp-preview');
  if(prev){
    const clear = cpick.which==='bg' && !cfg.colorBg;
    prev.classList.toggle('checker', clear);
    prev.style.background = clear ? '' : hex;
  }

  if(origin!=='hex'){
    const f=el.querySelector('[data-cphex]');
    if(f && f!==document.activeElement) f.value=hex.replace('#','');
  }
  if(origin!=='chan'){
    const vals = cpick.mode==='rgb' ? rgb : rgb2cmyk(rgb);
    el.querySelectorAll('[data-cpchan]').forEach((inp,i)=>{
      if(vals[i]===undefined) return;
      inp.value=Math.round(vals[i]);
      const out=inp.parentElement.querySelector('.v');
      if(out) out.textContent=Math.round(vals[i]);
    });
  } else {
    /* Dragging: the slider owns its own position, only the number moves. */
    el.querySelectorAll('[data-cpchan]').forEach(inp=>{
      const out=inp.parentElement.querySelector('.v');
      if(out) out.textContent=Math.round(+inp.value);
    });
  }
}

/* Full rebuild — only on open and on RVB/CMJN switch. Anything that fires
   while a control is in use goes through cpickSyncFields() instead. */
function renderCpick(){
  const el=document.getElementById('cpick');
  if(!el) return;
  el.classList.toggle('open', cpick.open);
  if(!cpick.open){ el.innerHTML=''; return; }
  const hex=cpickValue(), rgb=hex2rgb(hex)||[0,0,0];
  /* A null background is not "white", it is no background at all — show the
     checker rather than a colour the export would then have to invent. */
  const clear = cpick.which==='bg' && !cfg.colorBg;
  const chans = cpick.mode==='rgb'
    ? [['R',rgb[0],255],['G',rgb[1],255],['B',rgb[2],255]]
    : rgb2cmyk(rgb).map((v,i)=>[['C','M','J','N'][i], v, 100]);
  el.innerHTML=`
    <div class="cp-top">
      <span class="cp-name">${cpick.which==='ink'?'font':'background'}</span>
      <span class="cp-preview${clear?' checker':''}"${clear?'':` style="background:${hex}"`}></span>
    </div>
    <div class="seg">
      <button data-cpmode="rgb" class="${cpick.mode==='rgb'?'on':''}">RVB</button>
      <button data-cpmode="cmyk" class="${cpick.mode==='cmyk'?'on':''}">CMJN</button>
    </div>
    ${chans.map((c,i)=>`<div class="cp-row">
        <span class="k">${c[0]}</span>
        <input type="range" min="0" max="${c[2]}" step="1" value="${Math.round(c[1])}"
               data-cpchan="${i}">
        <span class="v">${Math.round(c[1])}</span>
      </div>`).join('')}
    <label class="cp-hex"><span>#</span>
      <input type="text" maxlength="7" value="${hex.replace('#','')}" data-cphex></label>
    ${cpick.which==='bg'?`<div class="seg cp-alpha">
      <button data-cpalpha class="${clear?'on':''}">transparent</button></div>`:''}`;
}

function openCpick(which){
  if(cpick.open && cpick.which===which){ cpick.open=false; renderCpick(); return; }
  cpick.which=which; cpick.open=true;
  const anchor=document.getElementById(which==='ink'?'swInk':'swBg');
  const el=document.getElementById('cpick');
  const ar=anchor.getBoundingClientRect();
  /* Position fixed: below the swatch, clamped to viewport */
  const top = ar.bottom + 8;
  const left = Math.max(6, Math.min(ar.left - 14, window.innerWidth - 230));
  el.style.top = top + 'px';
  el.style.left = left + 'px';
  renderCpick();
}

document.querySelector('.ctrl').addEventListener('click', ev=>{
  const sw=ev.target.closest('[data-swatch]');
  if(sw){ ev.stopPropagation(); openCpick(sw.dataset.swatch); }
});
/* Everything inside the popover is handled here and stops there. Letting a
   click bubble on would reach the close-on-outside-click handler after this
   rebuilt the contents — and a detached target reads as "outside", which
   closed the picker the moment you switched mode. */
document.getElementById('cpick').addEventListener('click', ev=>{
  ev.stopPropagation();
  const m=ev.target.closest('[data-cpmode]');
  if(m && m.dataset.cpmode!==cpick.mode){ cpick.mode=m.dataset.cpmode; renderCpick(); return; }
  /* Transparency was a one-way door: cfg.colorBg starts null, and the moment
     you touched a slider there was no way back to it — so a transparent GIF
     was unreachable after any background edit. */
  if(ev.target.closest('[data-cpalpha]')){
    cfg.colorBg = cfg.colorBg ? null : '#ffffff';
    syncSwatches(); renderCpick(); render();
  }
});
document.getElementById('cpick').addEventListener('input', ev=>{
  const el=document.getElementById('cpick');
  const ch=ev.target.closest('[data-cpchan]');
  if(ch){
    const vals=[...el.querySelectorAll('[data-cpchan]')].map(x=>+x.value);
    const rgb = cpick.mode==='rgb' ? vals : cmyk2rgb(vals);
    cpickSet(rgb2hex(rgb), 'chan');
    return;
  }
  const hx=ev.target.closest('[data-cphex]');
  if(hx){
    /* Only commit once six digits are actually there, so half-typed values
       don't repaint the artwork on every keystroke. */
    const rgb=hex2rgb(hx.value);
    if(rgb) cpickSet(rgb2hex(rgb), 'hex');
  }
});
document.addEventListener('click', ev=>{
  if(!cpick.open) return;
  if(ev.target.closest('#cpick') || ev.target.closest('[data-swatch]')) return;
  cpick.open=false; renderCpick();
});
document.getElementById('alignGroup').addEventListener('click', ev=>{
  const b=ev.target.closest('[data-align]'); if(!b) return;
  cfg.align=b.dataset.align;
  document.querySelectorAll('#alignGroup button').forEach(x=>x.classList.toggle('on', x===b));
  syncEditor(); render();
});
document.getElementById('tracking').addEventListener('input', ev=>{
  cfg.tracking=+ev.target.value||0; syncEditor(); render();
});
document.querySelectorAll('[data-nudge]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const input=document.getElementById(btn.dataset.nudge);
    input.value=(+input.value)+(+btn.dataset.dir);
    input.dispatchEvent(new Event('input'));
  });
});

/* ── Text box ── */
const textArea=document.getElementById('text');
const clearBtn=document.getElementById('clearBtn');
function syncClear(){ clearBtn.classList.toggle('on', textArea.value.length>0); }
textArea.addEventListener('input', ()=>{ renderPreview(); syncClear(); });
/* The SVG has no scrollbar of its own — it follows the textarea's. */
textArea.addEventListener('scroll', renderPreview);
/* Moving the caret can scroll the box without firing 'input'. */

textArea.addEventListener('click', renderPreview);

          .catch(()=>setNote('SVG unreadable.'));

document.getElementById('fontFile').addEventListener('change', e=>{

window.addEventListener('resize', ()=>{ syncEditor(); renderPreview(); });

const setNote = t => document.getElementById('railnote').textContent = t;
const setFontLabel = t => { const el=document.getElementById('fontLabel'); if(el) el.textContent=t; };

function injectFontFace(f){
  try{
    const bytes=new Uint8Array(f.toArrayBuffer());
    let binary='';
    const CH=0x8000;
    for(let i=0;i<bytes.length;i+=CH) binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
    const b64=btoa(binary);
    const old=document.getElementById('injectedFont'); if(old) old.remove();
    const style=document.createElement('style');
    style.id='injectedFont';
    style.textContent=`@font-face{font-family:'glyphlab-font';src:url(data:font/otf;base64,${b64}) format('opentype');font-display:block;}`;
    document.head.appendChild(style);
  }catch(e){}
}

let fontName='—';
function setFont(f, label){
  clearArtwork(true);
  font=f; upm=f.unitsPerEm||1000; ready=true; baseOverride=null; fontName=label;
  setNote('Ready'); setFontLabel(label);
  injectFontFace(f);
  const gc=document.getElementById('glyphCount');
  if(gc) gc.textContent=(f.numGlyphs||'—')+' glyphs';
  syncEditor();
  cache.clear(); renderNow();}

function loadCustom(file, e){
  const R=new FileReader();
  const done = cs => {
    if(!cs||!cs.length){ setNote('Shape unreadable.'); return; }
    e.p.custom=normalize(cs); e.p.customName=file.name; e.p.shape='custom';
    renderSidebar(); invalidate();
  };
  if(/svg/i.test(file.type)||/\.svg$/i.test(file.name)){
    R.onload=()=>done(svgTextToContours(R.result));
    R.readAsText(file);
  } else {
    R.onload=()=>{ const im=new Image(); im.onload=()=>{
      const N=110, s=Math.min(N/im.width,N/im.height), w=Math.max(2,Math.round(im.width*s)), h=Math.max(2,Math.round(im.height*s));
      const cc=document.createElement('canvas'); cc.width=w+4; cc.height=h+4;
      const xx=cc.getContext('2d',{colorSpace:'srgb', willReadFrequently:true});
      xx.drawImage(im,2,2,w,h);
      const dd=xx.getImageData(0,0,cc.width,cc.height).data, f=new Float32Array(cc.width*cc.height);
      for(let i=0;i<f.length;i++){ const a=dd[i*4+3]/255, lum=1-(dd[i*4]*0.299+dd[i*4+1]*0.587+dd[i*4+2]*0.114)/255; f[i]=a<0.5?0:lum; }
      const F={f,w:cc.width,h:cc.height,cell:1,x0:0,y0:0,ytop:cc.height}; boxBlur(F,1);
      done(marching(F,0.5).map(c=>simplify(c,0.55)).filter(c=>c.length>3)); };
      im.src=R.result; };
    R.readAsDataURL(file);
  }
}

/* ── Scroll indicator ───────────────────────────────────────────
   A pill tracking a scroller, drawn in the same ink as everything
   else. Fixed-positioned so it never disturbs the layout it sits on. */
function scrollBar(el){
  const bar=document.createElement('div'); bar.className='sbar';
  const thumb=document.createElement('div'); thumb.className='sbar-thumb';
  bar.appendChild(thumb); document.body.appendChild(bar);
  let hide, drag=null, queued=false;

  const place=()=>{
    queued=false;
    const r=el.getBoundingClientRect();
    const travel=el.scrollHeight-el.clientHeight;
    if(travel<2 || r.height<48){ bar.style.display='none'; return; }
    bar.style.display='block';
    const h=r.height-10;
    bar.style.top=(r.top+5)+'px'; bar.style.left=(r.right-10)+'px'; bar.style.height=h+'px';
    const th=Math.max(26, h*(el.clientHeight/el.scrollHeight));
    thumb.style.height=th+'px';
    thumb.style.transform='translateY('+((el.scrollTop/travel)*(h-th))+'px)';
  };
  const update=()=>{ if(!queued){ queued=true; requestAnimationFrame(place); } };
  const show=()=>{ bar.classList.add('on'); clearTimeout(hide); };
  const fade=ms=>{ clearTimeout(hide); hide=setTimeout(()=>{ if(!drag) bar.classList.remove('on'); }, ms); };

  el.addEventListener('scroll', ()=>{ update(); show(); fade(900); }, {passive:true});
  el.addEventListener('pointerenter', ()=>{ update(); show(); });
  el.addEventListener('pointerleave', ()=> fade(350));
  bar.addEventListener('pointerenter', show);
  bar.addEventListener('pointerleave', ()=> fade(350));

  thumb.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    const h=bar.getBoundingClientRect().height, th=thumb.getBoundingClientRect().height;
    drag={y:ev.clientY, top:el.scrollTop,
          k:(el.scrollHeight-el.clientHeight)/Math.max(1,h-th)};
    thumb.classList.add('drag'); thumb.setPointerCapture(ev.pointerId); show();
  });
  thumb.addEventListener('pointermove', ev=>{
    if(!drag) return;
    el.scrollTop = drag.top + (ev.clientY-drag.y)*drag.k;
  });
  const stop=()=>{ if(!drag) return; drag=null; thumb.classList.remove('drag'); fade(700); };
  thumb.addEventListener('pointerup', stop);
  thumb.addEventListener('pointercancel', stop);

  new ResizeObserver(update).observe(el);
  new MutationObserver(update).observe(el,{childList:true,subtree:true,attributes:true});
  window.addEventListener('resize', update);
  update();
}
document.querySelectorAll('.main,.fxscroll').forEach(scrollBar);

})();
